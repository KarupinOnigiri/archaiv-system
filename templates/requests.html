{% extends "base.html" %}
{% block content %}
<div class="pt-6 pr-[1.875rem] pb-6 pl-6 space-y-6">

  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Approvals</h1>
      
    </div>
  </div>

  <div class="bg-base-100 rounded-xl border border-base-300 p-5">

    <div class="flex items-center justify-between gap-4 mb-5">
      <div role="tablist" class="tabs tabs-boxed w-fit">
        <a role="tab" id="requests-tab-unrestriction" class="tab {% if active_tab == 'unrestriction' %}tab-active{% endif %}" onclick="switchRequestsTab('unrestriction')">
          Unrestriction Requests
          <span id="unrestriction-tab-badge" class="badge badge-sm badge-primary ml-2 hidden"></span>
        </a>
        <a role="tab" id="requests-tab-deactivation" class="tab {% if active_tab == 'deactivation' %}tab-active{% endif %}" onclick="switchRequestsTab('deactivation')">
          Admin Deactivations
          <span id="deactivation-tab-badge" class="badge badge-sm badge-primary ml-2 hidden"></span>
        </a>
      </div>
      <span id="requests-spinner" class="htmx-indicator loading loading-spinner loading-sm text-primary"></span>
    </div>

    <!-- Unrestriction Requests panel -->
    <div id="requests-panel-unrestriction" {% if active_tab != 'unrestriction' %}class="hidden"{% endif %}>
      <div class="flex flex-wrap items-center gap-3 mb-4">

        <button type="button" id="refresh-unrestriction-btn" class="btn btn-ghost btn-sm btn-circle shrink-0" data-tooltip="Refresh list" aria-label="Refresh unrestriction requests" onclick="refreshRequestsTable('unrestriction')">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>

        <!-- Ring-highlighted join + clear button, same convention as every other
             filter dropdown (assets.html). "Pending" is this filter's default
             (see requests_page's _panel_status), so clear targets that, not blank. -->
        <div id="unrestriction-status-filter-wrap" class="join rounded-lg transition-shadow" data-tooltip="Status">
          <button type="button" id="unrestriction-status-filter-clear-btn" class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100 text-base-content/40 hover:text-base-content hover:bg-base-200 disabled:hover:bg-base-100 disabled:hover:text-base-content/40 disabled:cursor-default disabled:opacity-50 transition-colors"
                  onclick="clearRequestsStatusFilter('unrestriction')" aria-label="Clear status filter" data-tooltip="Clear status filter" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          </button>
          <select id="unrestriction-status-filter" name="status"
                  aria-label="Filter unrestriction requests by status"
                  class="select select-bordered select-sm join-item w-40"
                  hx-get="/api/v1/unrestriction-requests"
                  hx-trigger="change"
                  hx-target="#unrestriction-table-container"
                  hx-swap="innerHTML"
                  hx-indicator="#requests-spinner"
                  hx-include="#unrestriction-mine-filter"
                  hx-vals='{"limit": {{ limit }}, "offset": 0}'>
            <option value="pending" {% if u_status == "pending" %}selected{% endif %}>Pending</option>
            <option value="approved" {% if u_status == "approved" %}selected{% endif %}>Approved</option>
            <option value="denied" {% if u_status == "denied" %}selected{% endif %}>Denied</option>
            <option value="cancelled" {% if u_status == "cancelled" %}selected{% endif %}>Cancelled</option>
            <option value="" {% if u_status == "" %}selected{% endif %}>All statuses</option>
          </select>
        </div>

        {% if staff.role in ["admin", "in_charge"] %}
        <!-- Same pill-toggle style as Staff's/Assets' show-inactive/show-archived toggles. -->
        <label id="unrestriction-mine-toggle-label" class="flex items-center gap-2 text-sm cursor-pointer select-none px-2.5 py-1 rounded-full transition-colors {% if u_mine %}text-primary font-semibold bg-primary/10{% else %}text-base-content/70{% endif %}">
          <input type="checkbox" id="unrestriction-mine-filter" name="mine" value="1"
                 class="toggle toggle-sm {% if u_mine %}toggle-primary{% endif %}" {% if u_mine %}checked{% endif %}
                 hx-get="/api/v1/unrestriction-requests"
                 hx-trigger="change"
                 hx-target="#unrestriction-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#requests-spinner"
                 hx-include="#unrestriction-status-filter"
                 hx-vals='js:{"limit": {{ limit }}, "offset": 0, "mine": event.target.checked ? "1" : "0"}'>
          Only mine
        </label>
        {% endif %}

        <button type="button" id="clear-unrestriction-filters-btn" class="btn btn-ghost btn-xs btn-circle text-error hover:bg-error/10 hidden relative" onclick="clearAllRequestsFilters('unrestriction')" data-tooltip="Clear filters (Esc)" aria-label="Clear filters">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          <span id="clear-unrestriction-filters-count" class="absolute -top-1 -right-1 bg-error text-error-content text-[10px] font-semibold rounded-full w-4 h-4 flex items-center justify-center leading-none">0</span>
        </button>
      </div>

      <div id="unrestriction-table-container"
           hx-get="/api/v1/unrestriction-requests"
           hx-trigger="load"
           hx-target="#unrestriction-table-container"
           hx-swap="innerHTML"
           hx-indicator="#requests-spinner"
           hx-vals='{"limit": {{ limit }}, "offset": {{ u_offset }}, "status": {{ u_status | tojson }}, "mine": {{ "1" if u_mine else "0" }} }'>
      </div>
    </div>

    <!-- Admin Deactivation Requests panel -->
    <div id="requests-panel-deactivation" {% if active_tab != 'deactivation' %}class="hidden"{% endif %}>
      <div class="flex flex-wrap items-center gap-3 mb-4">

        <button type="button" id="refresh-deactivation-btn" class="btn btn-ghost btn-sm btn-circle shrink-0" data-tooltip="Refresh list" aria-label="Refresh admin deactivation requests" onclick="refreshRequestsTable('deactivation')">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>

        <div id="deactivation-status-filter-wrap" class="join rounded-lg transition-shadow" data-tooltip="Status">
          <button type="button" id="deactivation-status-filter-clear-btn" class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100 text-base-content/40 hover:text-base-content hover:bg-base-200 disabled:hover:bg-base-100 disabled:hover:text-base-content/40 disabled:cursor-default disabled:opacity-50 transition-colors"
                  onclick="clearRequestsStatusFilter('deactivation')" aria-label="Clear status filter" data-tooltip="Clear status filter" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
          </button>
          <select id="deactivation-status-filter" name="status"
                  aria-label="Filter admin deactivation requests by status"
                  class="select select-bordered select-sm join-item w-40"
                  hx-get="/api/v1/admin-deactivation-requests"
                  hx-trigger="change"
                  hx-target="#deactivation-table-container"
                  hx-swap="innerHTML"
                  hx-indicator="#requests-spinner"
                  hx-include="#deactivation-mine-filter"
                  hx-vals='{"limit": {{ limit }}, "offset": 0}'>
            <option value="pending" {% if d_status == "pending" %}selected{% endif %}>Pending</option>
            <option value="approved" {% if d_status == "approved" %}selected{% endif %}>Approved</option>
            <option value="denied" {% if d_status == "denied" %}selected{% endif %}>Denied</option>
            <option value="cancelled" {% if d_status == "cancelled" %}selected{% endif %}>Cancelled</option>
            <option value="" {% if d_status == "" %}selected{% endif %}>All statuses</option>
          </select>
        </div>

        {% if staff.role in ["admin", "in_charge"] %}
        <label id="deactivation-mine-toggle-label" class="flex items-center gap-2 text-sm cursor-pointer select-none px-2.5 py-1 rounded-full transition-colors {% if d_mine %}text-primary font-semibold bg-primary/10{% else %}text-base-content/70{% endif %}">
          <input type="checkbox" id="deactivation-mine-filter" name="mine" value="1"
                 class="toggle toggle-sm {% if d_mine %}toggle-primary{% endif %}" {% if d_mine %}checked{% endif %}
                 hx-get="/api/v1/admin-deactivation-requests"
                 hx-trigger="change"
                 hx-target="#deactivation-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#requests-spinner"
                 hx-include="#deactivation-status-filter"
                 hx-vals='js:{"limit": {{ limit }}, "offset": 0, "mine": event.target.checked ? "1" : "0"}'>
          Only mine
        </label>
        {% endif %}

        <button type="button" id="clear-deactivation-filters-btn" class="btn btn-ghost btn-xs btn-circle text-error hover:bg-error/10 hidden relative" onclick="clearAllRequestsFilters('deactivation')" data-tooltip="Clear filters (Esc)" aria-label="Clear filters">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          <span id="clear-deactivation-filters-count" class="absolute -top-1 -right-1 bg-error text-error-content text-[10px] font-semibold rounded-full w-4 h-4 flex items-center justify-center leading-none">0</span>
        </button>
      </div>

      <div id="deactivation-table-container"
           hx-get="/api/v1/admin-deactivation-requests"
           hx-trigger="load"
           hx-target="#deactivation-table-container"
           hx-swap="innerHTML"
           hx-indicator="#requests-spinner"
           hx-vals='{"limit": {{ limit }}, "offset": {{ d_offset }}, "status": {{ d_status | tojson }}, "mine": {{ "1" if d_mine else "0" }} }'>
      </div>
    </div>

  </div>
</div>

<div id="modal-container"></div>

<script>
// Turns each row's data-created-at into a relative "waiting" label, computed
// client-side so it stays accurate between refetches. Pending rows past 3
// days get flagged in warning color, so a stale request doesn't look as
// fresh as one filed two minutes ago.
const REQUEST_AGING_THRESHOLD_DAYS = 3;

function formatWaiting(createdAt) {
  // SQLite's "YYYY-MM-DD HH:MM:SS" is local time -- swap the space for 'T' so
  // Date doesn't misread it as UTC (matches how the rest of the app renders these).
  const then = new Date(createdAt.replace(' ', 'T'));
  if (isNaN(then.getTime())) return { text: createdAt, days: 0 };
  const diffMs = Date.now() - then.getTime();
  // Clamped to 0 so a few seconds of clock skew doesn't read as a negative minute count.
  const diffMinutes = Math.max(0, diffMs / (1000 * 60));
  const diffHours = diffMinutes / 60;
  const diffDays = diffHours / 24;
  let text;
  if (diffMinutes < 1) text = 'just now';
  else if (diffMinutes < 60) text = `${Math.floor(diffMinutes)}m ago`;
  else if (diffHours < 24) text = `${Math.floor(diffHours)}h ago`;
  else text = `${Math.floor(diffDays)}d ago`;
  return { text, days: diffDays };
}

function renderWaitingBadges() {
  document.querySelectorAll('.request-waiting-badge').forEach(function (el) {
    const createdAt = el.dataset.createdAt;
    if (!createdAt) return;
    const isPending = el.dataset.pending === 'true';
    const { text, days } = formatWaiting(createdAt);
    el.textContent = text;
    el.classList.toggle('text-warning', isPending && days >= REQUEST_AGING_THRESHOLD_DAYS);
    el.classList.toggle('font-medium', isPending && days >= REQUEST_AGING_THRESHOLD_DAYS);
    if (isPending && days >= REQUEST_AGING_THRESHOLD_DAYS) {
      el.title = `Filed ${Math.floor(days)} day${Math.floor(days) === 1 ? '' : 's'} ago and still pending`;
    }
  });
}

// Keeps each tab's little count badge in sync with its table's pending
// count -- only meaningful while that tab's filter is actually "Pending"
// (the common/default case), so it's hidden entirely once someone switches
// that tab's filter to something else rather than showing a stale number.
document.addEventListener('htmx:afterSwap', function (evt) {
  const container = evt.target;
  let badgeId, filterId;
  if (container.id === 'unrestriction-table-container') {
    badgeId = 'unrestriction-tab-badge';
    filterId = 'unrestriction-status-filter';
  } else if (container.id === 'deactivation-table-container') {
    badgeId = 'deactivation-tab-badge';
    filterId = 'deactivation-status-filter';
  } else {
    return;
  }
  const badge = document.getElementById(badgeId);
  const filter = document.getElementById(filterId);
  const table = container.querySelector('table');
  const count = table ? parseInt(table.dataset.totalCount || '0', 10) : 0;
  if (filter.value === 'pending' && count > 0) {
    badge.textContent = count;
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
});

// Endpoint + container lookups shared by every helper below, keyed by
// panel kind ('unrestriction' / 'deactivation') -- same idea as
// REQUESTS_URL_PREFIX_BY_CONTAINER above, just indexed the other way.
const REQUESTS_PANEL_CONFIG = {
  unrestriction: { url: '/api/v1/unrestriction-requests', container: 'unrestriction-table-container' },
  deactivation: { url: '/api/v1/admin-deactivation-requests', container: 'deactivation-table-container' },
};

// Same active-filter ring/clear-button/count-badge pattern as Members'/
// Assets' filter rows -- "Pending" counts as this filter's default (see
// requests_page's _panel_status), not blank.
function updateRequestsFilterUI(kind) {
  const status = document.getElementById(`${kind}-status-filter`);
  const mine = document.getElementById(`${kind}-mine-filter`);

  const statusActive = status.value !== 'pending';
  const mineActive = !!(mine && mine.checked);

  document.getElementById(`${kind}-status-filter-wrap`).classList.toggle('ring-2', statusActive);
  document.getElementById(`${kind}-status-filter-wrap`).classList.toggle('ring-primary/40', statusActive);
  document.getElementById(`${kind}-status-filter-clear-btn`).disabled = !statusActive;

  const mineLabel = document.getElementById(`${kind}-mine-toggle-label`);
  if (mineLabel) {
    mineLabel.classList.toggle('text-primary', mineActive);
    mineLabel.classList.toggle('font-semibold', mineActive);
    mineLabel.classList.toggle('bg-primary/10', mineActive);
    mineLabel.classList.toggle('text-base-content/70', !mineActive);
    mine.classList.toggle('toggle-primary', mineActive);
  }

  const anyActive = statusActive || mineActive;
  const activeCount = [statusActive, mineActive].filter(Boolean).length;
  const clearBtn = document.getElementById(`clear-${kind}-filters-btn`);
  clearBtn.classList.toggle('hidden', !anyActive);
  document.getElementById(`clear-${kind}-filters-count`).textContent = activeCount;
  const clearLabel = activeCount > 0 ? `Clear ${activeCount} filter${activeCount > 1 ? 's' : ''}` : 'Clear filters';
  clearBtn.setAttribute('title', clearLabel);
  clearBtn.setAttribute('aria-label', clearLabel);
}

function clearRequestsStatusFilter(kind) {
  const el = document.getElementById(`${kind}-status-filter`);
  if (el.value === 'pending') return;
  el.value = 'pending';
  el.dispatchEvent(new Event('change'));
}

function clearAllRequestsFilters(kind) {
  const status = document.getElementById(`${kind}-status-filter`);
  const mine = document.getElementById(`${kind}-mine-filter`);
  const alreadyDefault = status.value === 'pending' && (!mine || !mine.checked);
  if (alreadyDefault) return;
  status.value = 'pending';
  if (mine) mine.checked = false;
  updateRequestsFilterUI(kind);
  const { url, container } = REQUESTS_PANEL_CONFIG[kind];
  htmx.ajax('GET', url, {
    target: `#${container}`,
    swap: 'innerHTML',
    values: { limit: '{{ limit }}', offset: 0, status: 'pending', mine: '0' }
  });
}

// Re-fetches whichever panel's table with whatever filters/page are
// currently in effect, read straight off that panel's own live controls
// plus its currently-rendered table's own data-limit/data-offset -- a
// manual refresh shouldn't jump back to page 1 the way changing a filter
// does.
function refreshRequestsTable(kind) {
  const { url, container } = REQUESTS_PANEL_CONFIG[kind];
  const table = document.querySelector(`#${container} table`);
  const status = document.getElementById(`${kind}-status-filter`).value;
  const mine = document.getElementById(`${kind}-mine-filter`);
  const params = new URLSearchParams();
  params.set('status', status);
  params.set('mine', mine && mine.checked ? '1' : '0');
  params.set('limit', (table && table.dataset.limit) || '{{ limit }}');
  params.set('offset', (table && table.dataset.offset) || '0');
  htmx.ajax('GET', url, {
    target: `#${container}`,
    swap: 'innerHTML',
    values: Object.fromEntries(params)
  });
}

['unrestriction', 'deactivation'].forEach(function (kind) {
  document.getElementById(`${kind}-status-filter`).addEventListener('change', function () { updateRequestsFilterUI(kind); });
  const mine = document.getElementById(`${kind}-mine-filter`);
  if (mine) mine.addEventListener('change', function () { updateRequestsFilterUI(kind); });
});
document.addEventListener('DOMContentLoaded', function () {
  updateRequestsFilterUI('unrestriction');
  updateRequestsFilterUI('deactivation');
});

function switchRequestsTab(tab) {
  document.getElementById('requests-tab-unrestriction').classList.toggle('tab-active', tab === 'unrestriction');
  document.getElementById('requests-tab-deactivation').classList.toggle('tab-active', tab === 'deactivation');
  document.getElementById('requests-panel-unrestriction').classList.toggle('hidden', tab !== 'unrestriction');
  document.getElementById('requests-panel-deactivation').classList.toggle('hidden', tab !== 'deactivation');

  // Persists which tab is showing into the URL -- routes/pages.py's
  // requests_page reads this ?tab= back on load so a bookmarked or
  // refreshed link reopens on the same tab instead of always resetting
  // to Unrestriction.
  try {
    const url = new URL(window.location.href);
    url.searchParams.set('tab', tab);
    history.replaceState(null, '', url.pathname + '?' + url.searchParams.toString());
  } catch (e) {
    // Non-critical.
  }
}

// Keeps each panel's own status/mine/offset in the URL under its own
// prefix (u_/d_, matching routes/pages.py's requests_page) so both
// tabs' filter state round-trips independently through one query
// string -- same htmx:configRequest pattern as every other filtered
// table in the app, just fanned out over two containers instead of one.
const REQUESTS_URL_PREFIX_BY_CONTAINER = {
  'unrestriction-table-container': 'u',
  'deactivation-table-container': 'd',
};

document.body.addEventListener('htmx:configRequest', function (evt) {
  const prefix = REQUESTS_URL_PREFIX_BY_CONTAINER[evt.detail.target && evt.detail.target.id];
  if (!prefix) return;
  try {
    const params = evt.detail.parameters || {};
    const url = new URL(window.location.href);
    ['status', 'mine', 'offset'].forEach(function (key) {
      const value = params[key];
      const urlKey = `${prefix}_${key}`;
      if (value !== '' && value !== null && value !== undefined && !(key === 'mine' && value === '0')) {
        url.searchParams.set(urlKey, value);
      } else {
        url.searchParams.delete(urlKey);
      }
    });
    history.replaceState(null, '', url.pathname + '?' + url.searchParams.toString());
  } catch (e) {
    // URL sync is a non-critical enhancement -- never let it break the actual request.
  }
});

// Shared POST-and-refresh helper for every approve/deny/cancel action below --
// mirrors staffAction() on the Staff page (same fetch+CSRF+reload shape). A
// full reload (rather than an htmx table refresh) is deliberate: approving/
// denying one request can change the *other* tab's contents too (e.g. an
// admin deactivation finalizing changes who counts as an eligible approver
// elsewhere), and the sidebar's Approvals badge needs to update either way.
async function requestAction(url, body, successMessage) {
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
      },
      body: JSON.stringify(body || {}),
    });
    const result = await res.json();

    if (res.status === 401) {
      showSessionTimeoutModal();
      return;
    }

    if (!res.ok) {
      showToast(result.error || "That action couldn't be completed", 'error');
      return;
    }

    sessionStorage.setItem('pending-toast', JSON.stringify({ message: successMessage || result.message, type: 'success' }));
    window.location.reload();
  } catch (err) {
    showToast("That action couldn't be completed", 'error');
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Reads the request-row's own leftmost cell (member name / @target
// username, both already rendered) rather than re-fetching anything, so
// the confirm dialog can name who it's actually acting on.
function rowSubjectName(triggerEl) {
  const cell = triggerEl.closest('tr').querySelector('td:first-child');
  return cell ? cell.innerText.trim() : 'this request';
}

// Plain yes/no confirm -- used for Approve and Cancel. Same backdrop/box
// shape as confirmBulkDeactivate() on the Staff/Members pages, just
// generalized (icon, colors, labels all passed in) since this needs four
// different flavors of it (approve x2, cancel x2) rather than one.
function showConfirmDialog({ iconPath, iconClass, title, message, confirmLabel, confirmClass, onConfirm }) {
  const backdrop = document.createElement('div');
  backdrop.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4';
  backdrop.innerHTML = `
    <div class="bg-base-100 rounded-xl shadow-xl border border-base-300 w-full max-w-sm p-5" role="alertdialog" aria-modal="true" aria-labelledby="request-confirm-title">
      <div class="flex items-start gap-3">
        <div class="w-9 h-9 rounded-full ${iconClass}/10 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ${iconClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${iconPath}</svg>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex justify-between items-start gap-2">
            <h3 id="request-confirm-title" class="font-semibold">${escapeHtml(title)}</h3>
            <button type="button" id="request-confirm-close-btn" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
          </div>
          <p class="text-sm text-base-content/60 mt-1">${escapeHtml(message)}</p>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-5">
        <button type="button" id="request-confirm-cancel-btn" class="btn btn-ghost btn-sm">Cancel</button>
        <button type="button" id="request-confirm-ok-btn" class="btn ${confirmClass} btn-sm">${escapeHtml(confirmLabel)}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);

  function close() {
    backdrop.remove();
    document.removeEventListener('keydown', onKeydown);
  }
  function onKeydown(e) {
    if (e.key === 'Escape') close();
  }
  document.addEventListener('keydown', onKeydown);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('#request-confirm-close-btn').addEventListener('click', close);
  backdrop.querySelector('#request-confirm-cancel-btn').addEventListener('click', close);
  backdrop.querySelector('#request-confirm-ok-btn').addEventListener('click', () => { close(); onConfirm(); });
  backdrop.querySelector('#request-confirm-ok-btn').focus();
}

// Same shape as showConfirmDialog, plus a reason textarea -- used for Deny.
// When reasonRequired is true the confirm button stays disabled until
// something's typed, rather than letting an empty reason through and
// having the server reject it after the dialog's already closed.
function showReasonDialog({ iconPath, iconClass, title, message, placeholder, reasonRequired, confirmLabel, confirmClass, onConfirm }) {
  const backdrop = document.createElement('div');
  backdrop.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black/40 p-4';
  backdrop.innerHTML = `
    <div class="bg-base-100 rounded-xl shadow-xl border border-base-300 w-full max-w-sm p-5" role="alertdialog" aria-modal="true" aria-labelledby="request-reason-title">
      <div class="flex items-start gap-3">
        <div class="w-9 h-9 rounded-full ${iconClass}/10 flex items-center justify-center shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 ${iconClass}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">${iconPath}</svg>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex justify-between items-start gap-2">
            <h3 id="request-reason-title" class="font-semibold">${escapeHtml(title)}</h3>
            <button type="button" id="request-reason-close-btn" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
          </div>
          <p class="text-sm text-base-content/60 mt-1">${escapeHtml(message)}</p>
          <textarea id="request-reason-input" rows="3"
                    placeholder="${escapeHtml(placeholder)}"
                    class="textarea textarea-bordered w-full mt-3 text-sm"></textarea>
        </div>
      </div>
      <div class="flex justify-end gap-2 mt-4">
        <button type="button" id="request-reason-cancel-btn" class="btn btn-ghost btn-sm">Cancel</button>
        <button type="button" id="request-reason-ok-btn" class="btn ${confirmClass} btn-sm" ${reasonRequired ? 'disabled' : ''}>${escapeHtml(confirmLabel)}</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);

  const textarea = backdrop.querySelector('#request-reason-input');
  const okBtn = backdrop.querySelector('#request-reason-ok-btn');

  if (reasonRequired) {
    textarea.addEventListener('input', () => { okBtn.disabled = textarea.value.trim() === ''; });
  }

  function close() {
    backdrop.remove();
    document.removeEventListener('keydown', onKeydown);
  }
  function onKeydown(e) {
    if (e.key === 'Escape') close();
  }
  document.addEventListener('keydown', onKeydown);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
  backdrop.querySelector('#request-reason-close-btn').addEventListener('click', close);
  backdrop.querySelector('#request-reason-cancel-btn').addEventListener('click', close);
  okBtn.addEventListener('click', () => {
    const reason = textarea.value.trim();
    if (reasonRequired && !reason) return;
    close();
    onConfirm(reason);
  });
  textarea.focus();
}

const ICON_CHECK = '<path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>';
const ICON_X = '<circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/>';
const ICON_WARN = '<path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>';

function approveUnrestrictionRequest(id, btn) {

    iconPath: ICON_CHECK, iconClass: 'text-success',
    title: 'Approve unrestriction request?',
    message: `${name}'s restriction is lifted immediately once approved.`,
    confirmLabel: 'Approve', confirmClass: 'btn-success',
    onConfirm: () => requestAction(`/api/v1/unrestriction-requests/${id}/approve`, {}, 'Request approved, member unrestricted'),
  });
}

// --- Keyboard shortcuts (Approvals page) ---
// Same isTypingTarget/isModalOpen guard pattern as every other tab.
// ArrowLeft/Right and Escape are scoped to whichever of the two tabs
// (Unrestriction / Deactivation) is currently visible, read from the DOM
// rather than tracked separately so it can never drift out of sync with
// what switchRequestsTab() last set.
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

function isModalOpen() {
  const container = document.getElementById('modal-container');
  return !!(container && container.querySelector(':scope > .modal'));
}

function activeRequestsTab() {
  const unrestrictionPanel = document.getElementById('requests-panel-unrestriction');
  if (unrestrictionPanel && !unrestrictionPanel.classList.contains('hidden')) return 'unrestriction';
  return 'deactivation';
}

document.addEventListener('keydown', function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  // ArrowLeft / ArrowRight - previous / next page, on whichever tab is
  // currently showing.
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (isTypingTarget(e.target) || isModalOpen()) return;
    const tab = activeRequestsTab();
    const container = document.getElementById(`${tab}-table-container`);
    if (!container) return;
    const label = e.key === 'ArrowRight' ? 'Next page' : 'Previous page';
    const btn = container.querySelector('button[aria-label="' + label + '"]');
    if (btn && !btn.disabled) {
      e.preventDefault();
      btn.click();
    }
    return;
  }

  // Escape - with no modal open, reset the current tab's filters back to
  // their default (status = Pending, "Only mine" off) and blur whatever
  // was focused, same as clicking that tab's own "Clear filters" button
  // (clearAllRequestsFilters) -- this page has no single filter row
  // shared across both tabs the way Assets/Members do, so Escape only
  // ever touches whichever tab is currently visible. When a modal *is*
  // open, the shared Escape handler in base.html closes it instead.
  if (e.key === 'Escape') {
    if (isModalOpen()) return;
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
    clearAllRequestsFilters(activeRequestsTab());
  }
});
</script>
