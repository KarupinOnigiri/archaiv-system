<div class="modal modal-open">
  <div class="modal-box max-w-sm">
    <div class="flex justify-between items-start mb-2">
      <h3 class="font-bold text-lg">Restore Asset</h3>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>
    <p class="text-sm text-base-content/70 mb-4">
      Restore <strong>{{ asset.name }}</strong> ({{ asset.asset_id }}) back to active inventory.
      Its status will be set to <strong>available</strong>.
    </p>

    <!-- Always rendered (not just when there is an error) so its reserved space
         doesn't appear/disappear and shift the form below it - min-h-5
         matches a single line of text-sm content. -->
    <p class="text-error text-sm mb-3 min-h-5">{{ error or '' }}</p>

    <form hx-post="/api/v1/assets/{{ asset.id }}/restore" hx-target="closest .modal" hx-swap="outerHTML">
      <input type="hidden" name="return_to" value="{{ return_to }}">
      <div class="form-control mb-2">
        <label class="label">
          <span class="label-text">Condition</span>
          {% if asset.condition == 'disposed' %}
          <span class="label-text-alt text-error">Required - this asset was disposed</span>
          {% endif %}
        </label>
        <select name="condition" class="select select-bordered w-full">
          {% if asset.condition != 'disposed' %}
          <option value="">- Keep current ({{ asset.condition | humanize }}) -</option>
          {% endif %}
          {% for c in ["functional", "inoperable", "for_repair"] %}
          <option value="{{ c }}" {% if asset.condition == c %}selected{% endif %}>{{ c | humanize }}</option>
          {% endfor %}
        </select>
      </div>

      <!-- Restoring an archived asset back into active inventory is
           security-sensitive enough to require the acting admin's own
           password plus a logged reason, same re-confirmation pattern as
           staff/_reactivate_modal.html and /feature-flags/update. -->
      <div class="form-control mb-2">
        <label class="label"><span class="label-text">Your password <span class="text-error">*</span></span></label>
        <input type="password" name="current_password" placeholder="Current password"
               autocomplete="current-password" class="input input-bordered w-full">
      </div>
      <div class="form-control mb-2">
        <label class="label"><span class="label-text">Reason <span class="text-error">*</span></span></label>
        <textarea name="reason" rows="2" required
                  placeholder="Why is this asset being restored?"
                  class="textarea textarea-bordered w-full"></textarea>
      </div>

      <div class="modal-action">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Restore</button>
      </div>
    </form>
  </div>
</div>
