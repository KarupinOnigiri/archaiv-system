<div class="modal modal-open">
  <div class="modal-box max-w-sm">
    <div class="flex justify-between items-start mb-2">
      <h3 class="font-bold text-lg">Resolve Maintenance</h3>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>
    <p class="text-sm text-base-content/70 mb-4">
      Put <strong>{{ asset.name }}</strong> ({{ asset.asset_id }}) back into circulation.
      Its status will be set to <strong>available</strong>.
    </p>

    <!-- Always rendered (not just when there is an error) so its reserved space
         doesn't appear/disappear and shift the form below it - min-h-5
         matches a single line of text-sm content. -->
    <p class="text-error text-sm mb-3 min-h-5">{{ error or '' }}</p>

    <form hx-post="/api/v1/assets/{{ asset.id }}/resolve-maintenance" hx-target="closest .modal" hx-swap="outerHTML">
      <div class="form-control mb-2">
        <label class="label"><span class="label-text">Condition</span></label>
        <select name="condition" class="select select-bordered w-full">
          {% for c in ["functional", "for_repair", "inoperable"] %}
          <option value="{{ c }}" {% if asset.condition == c %}selected{% endif %}>{{ c | humanize }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-control mb-2">
        <label class="label"><span class="label-text">Notes</span><span class="label-text-alt text-base-content/40">Optional</span></label>
        <textarea name="notes" rows="2"
                  placeholder="e.g. replaced worn brushes"
                  class="textarea textarea-bordered w-full"></textarea>
      </div>

      <div class="form-control mb-2">
        <label class="label"><span class="label-text">Next Maintenance Due</span><span class="label-text-alt text-base-content/40">Optional</span></label>
        <input type="date" name="next_maintenance_due" value="{{ asset.next_maintenance_due or '' }}" class="input input-bordered w-full">
        <p class="text-[11px] text-base-content/50 mt-1">Servicing it now resets its checkout-based schedule too, if it has one.</p>
      </div>

      <div class="modal-action">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Mark Available</button>
      </div>
    </form>
  </div>
</div>
