<div class="modal modal-open">
  <div class="modal-box max-w-sm">
    <div class="flex justify-between items-start mb-2">
      <h3 class="font-bold text-lg">Mark for Maintenance</h3>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>
    <p class="text-sm text-base-content/70 mb-4">
      Take <strong>{{ asset.name }}</strong> ({{ asset.asset_id }}) out of circulation.
      Its status will be set to <strong>maintenance</strong> until it's resolved.
    </p>

    <!-- Always rendered (not just when there is an error) so its reserved space
         doesn't appear/disappear and shift the form below it - min-h-5
         matches a single line of text-sm content. -->
    <p class="text-error text-sm mb-3 min-h-5">{{ error or '' }}</p>

    <form hx-post="/api/v1/assets/{{ asset.id }}/mark-maintenance" hx-target="closest .modal" hx-swap="outerHTML">
      <div class="form-control mb-2">
        <label class="label"><span class="label-text">Reason</span><span class="label-text-alt text-base-content/40">Optional</span></label>
        <textarea name="notes" rows="2"
                  placeholder="e.g. chuck slipping, needs new brushes"
                  class="textarea textarea-bordered w-full"></textarea>
      </div>

      <div class="modal-action">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-error">Mark for Maintenance</button>
      </div>
    </form>
  </div>
</div>
