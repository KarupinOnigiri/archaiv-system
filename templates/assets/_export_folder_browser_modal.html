<!-- Standalone folder picker, lives outside #modal-container so it can stack without either wiping the other.
     Included once from base.html so its script registers handlers only once, not per modal open/close.
     Any input can use it: openFolderBrowser('some-input-id') writes the picked path back into that input. -->
<div id="export-folder-browser" class="hidden fixed inset-0 z-[9999] flex items-center justify-center p-4">
  <div id="export-folder-backdrop" class="absolute inset-0 bg-black/50"></div>

  <div class="relative bg-base-100 rounded-lg shadow-2xl border border-base-300 w-80 max-w-full flex flex-col max-h-[80vh]"
       role="dialog" aria-modal="true" aria-label="Select folder">
    <div class="flex items-center justify-between px-4 py-3 border-b border-base-300 shrink-0">
      <span class="text-sm font-semibold">Select Folder</span>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="closeFolderBrowser()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>

    <div class="px-4 pt-3">
      <span id="export-folder-breadcrumb" class="text-xs font-mono text-base-content/60 truncate block">/</span>
    </div>

    <div id="export-folder-list" class="flex-1 overflow-y-auto space-y-0.5 px-4 py-2 min-h-[8rem]"></div>

    <div class="px-4 pb-4 pt-2 border-t border-base-300 shrink-0">
      <div class="flex gap-2">
        <input type="text" id="export-new-folder-name" placeholder="New folder name"
               class="input input-bordered input-xs flex-1 bg-base-100">
        <button type="button" onclick="createBrowseFolder()" class="btn btn-xs btn-outline shrink-0">+ Add</button>
      </div>
      <div class="flex gap-2 mt-2">
        <button type="button" onclick="closeFolderBrowser()" class="btn btn-ghost btn-sm flex-1">
          Cancel
        </button>
        <button type="button" onclick="selectCurrentBrowseFolder()" class="btn btn-primary btn-sm flex-1">
          Use this folder
        </button>
      </div>
    </div>
  </div>
</div>

<script>
// Server-side folder picker: lists subfolders via /api/v1/assets/export/browse for click-through browsing.
// Rows use createElement/textContent, not innerHTML - folder names come from the filesystem, don't trust them as HTML.

var currentBrowsePath = '';
var folderBrowserTargetInput = null;

function openFolderBrowser(targetInputId) {
  folderBrowserTargetInput = document.getElementById(targetInputId || 'export-save-path');
  document.getElementById('export-folder-browser').classList.remove('hidden');
  document.addEventListener('keydown', handleFolderBrowserKeydown);
  const startPath = (folderBrowserTargetInput && folderBrowserTargetInput.value.trim()) || 'export';
  loadFolderList(startPath);
}

function closeFolderBrowser() {
  document.getElementById('export-folder-browser').classList.add('hidden');
  document.removeEventListener('keydown', handleFolderBrowserKeydown);
}

function handleFolderBrowserKeydown(event) {
  if (event.key === 'Escape') {
    event.stopPropagation();
    closeFolderBrowser();
  }
}

document.getElementById('export-folder-backdrop').addEventListener('click', closeFolderBrowser);

function makeBrowserRow(label, onClick, variant) {
  if (onClick) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'w-full text-left px-2 py-1.5 rounded hover:bg-base-300/50 text-sm truncate';
    btn.textContent = label;
    btn.addEventListener('click', onClick);
    return btn;
  }
  const div = document.createElement('div');
  div.className = 'text-xs px-2 py-1.5 ' + (variant === 'error' ? 'text-error' : 'text-base-content/40');
  div.textContent = label;
  return div;
}

async function loadFolderList(path) {
  const listEl = document.getElementById('export-folder-list');
  const crumbEl = document.getElementById('export-folder-breadcrumb');
  listEl.replaceChildren(makeBrowserRow('Loading...'));

  try {
    const res = await fetch('/api/v1/assets/export/browse?path=' + encodeURIComponent(path));
    const data = await res.json();

    if (!res.ok) {
      listEl.replaceChildren(makeBrowserRow(data.error || 'Failed to load folder', null, 'error'));
      return;
    }

    currentBrowsePath = data.path;
    crumbEl.textContent = '/' + data.path;

    const rows = [];
    if (data.parent_path !== null) {
      rows.push(makeBrowserRow('.. (up)', () => loadFolderList(data.parent_path)));
    }
    if (data.folders.length === 0) {
      rows.push(makeBrowserRow('No subfolders here.'));
    }
    data.folders.forEach((name) => {
      const childPath = data.path ? data.path + '/' + name : name;
      rows.push(makeBrowserRow('\u{1F4C1} ' + name, () => loadFolderList(childPath)));
    });
    listEl.replaceChildren(...rows);
  } catch (err) {
    listEl.replaceChildren(makeBrowserRow('Failed to load folder.', null, 'error'));
  }
}

function selectCurrentBrowseFolder() {
  if (folderBrowserTargetInput) {
    folderBrowserTargetInput.value = currentBrowsePath;
  }
  closeFolderBrowser();
}

async function createBrowseFolder() {
  const nameInput = document.getElementById('export-new-folder-name');
  const name = nameInput.value.trim();
  if (!name) return;

  const csrfMeta = document.querySelector('meta[name="csrf-token"]');
  const formData = new FormData();
  formData.append('path', currentBrowsePath);
  formData.append('name', name);

  try {
    const res = await fetch('/api/v1/assets/export/browse/mkdir', {
      method: 'POST',
      headers: csrfMeta ? { 'X-CSRF-Token': csrfMeta.content } : {},
      body: formData
    });
    const data = await res.json();
    if (!res.ok) {
      alert(data.error || 'Could not create folder.');
      return;
    }
    nameInput.value = '';
    loadFolderList(data.path);
  } catch (err) {
    alert('Could not create folder.');
  }
}
</script>
