{% extends "base.html" %}
{% block content %}
<div class="p-8">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 text-sm text-base-content/50 mb-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span>/</span>
    <span class="text-base-content">Inventory</span>
  </div>

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Inventory</h1>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-3 gap-4 mb-6" id="asset-stats">
    <div class="bg-base-100 rounded-xl shadow p-5">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold text-base-content/50 tracking-wide">ALL INVENTORY</span>
        <div class="w-9 h-9 rounded-lg bg-primary/10 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        </div>
      </div>
      <p class="text-3xl font-bold">{{ stat_all }}</p>
    </div>
    <div class="bg-base-100 rounded-xl shadow p-5">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold text-base-content/50 tracking-wide">AVAILABLE ITEMS</span>
        <div class="w-9 h-9 rounded-lg bg-success/10 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </div>
      </div>
      <p class="text-3xl font-bold">{{ stat_available }}</p>
    </div>
    <div class="bg-base-100 rounded-xl shadow p-5">
      <div class="flex items-center justify-between mb-3">
        <span class="text-xs font-semibold text-base-content/50 tracking-wide">CURRENTLY BORROWED</span>
        <div class="w-9 h-9 rounded-lg bg-info/10 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </div>
      </div>
      <p class="text-3xl font-bold">{{ stat_borrowed }}</p>
    </div>
  </div>

  <!-- Table card with toolbar -->
  <div class="bg-base-100 rounded-xl shadow p-6">
    <div class="flex justify-between items-center mb-4 gap-3">
      <input type="text" name="q" placeholder="Search by ID or name..."
             class="input input-bordered w-full max-w-md"
             hx-get="/api/v1/assets"
             hx-trigger="keyup changed delay:300ms"
             hx-target="#asset-table-container"
             hx-swap="innerHTML"
             hx-include="this">
      {% if staff.role in ["admin", "in_charge"] %}
      <button class="btn btn-primary rounded-lg shrink-0"
              hx-get="/api/v1/assets/add-form"
              hx-target="#modal-container"
              hx-swap="innerHTML">
        + Add New Item
      </button>
      {% endif %}
    </div>

    <div id="asset-table-container"
         hx-get="/api/v1/assets"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML">
      <p class="text-base-content/50 py-8 text-center">Loading assets...</p>
    </div>
  </div>

  <div id="modal-container"></div>
</div>
{% endblock %}
