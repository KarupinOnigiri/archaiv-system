{% extends "base.html" %}
{% block content %}
<div class="p-8">

  <!-- Breadcrumb -->
  <div class="flex items-center gap-2 text-sm text-base-content/50 mb-2">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    <span>/</span>
    <span class="text-base-content">Inventory</span>
  </div>

  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Inventory</h1>
  </div>

  <!-- Stat cards -->
  <div class="grid grid-cols-3 gap-5 mb-6" id="asset-stats">
    <div class="bg-base-100 rounded-xl shadow p-5">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-semibold text-base-content/50 tracking-wide">ALL INVENTORY</span>
        <div class="w-9 h-9 rounded-full bg-primary/10 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>
        </div>
      </div>
      <p class="text-3xl font-bold">{{ stat_all }}</p>
    </div>
    <div class="bg-base-100 rounded-xl shadow p-5">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-semibold text-base-content/50 tracking-wide">AVAILABLE ITEMS</span>
        <div class="w-9 h-9 rounded-full bg-success/10 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        </div>
      </div>
      <p class="text-3xl font-bold">{{ stat_available }}</p>
    </div>
    <div class="bg-base-100 rounded-xl shadow p-5">
      <div class="flex items-center justify-between mb-4">
        <span class="text-xs font-semibold text-base-content/50 tracking-wide">CURRENTLY BORROWED</span>
        <div class="w-9 h-9 rounded-full bg-info/10 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 014-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 01-4 4H3"/></svg>
        </div>
      </div>
      <p class="text-3xl font-bold">{{ stat_borrowed }}</p>
    </div>
  </div>

  <!-- Active / Archived tabs -->
  <div class="tabs tabs-boxed w-fit mb-5 bg-base-100 shadow">
    <button type="button" id="tab-active" class="tab tab-active" onclick="switchAssetView(false, this)">Active</button>
    <button type="button" id="tab-archived" class="tab" onclick="switchAssetView(true, this)">Archived</button>
  </div>

  <!-- Bulk actions bar (shown once a row is checked) -->
  <div id="bulk-actions-bar" class="hidden items-center justify-between bg-primary/10 border border-primary/30 rounded-lg px-4 py-2.5 mb-3">
    <p class="text-sm font-medium"><span id="bulk-selected-count">0</span> item(s) selected</p>
    <div class="flex gap-2">
      <button type="button" class="btn btn-xs btn-ghost" onclick="clearBulkSelection()">Clear</button>
      <button type="button" id="bulk-action-btn" class="btn btn-xs btn-error" onclick="openBulkActionModal()">Delete Selected</button>
    </div>
  </div>

  <!-- Table card with toolbar -->
  <div class="bg-base-100 rounded-xl shadow p-6">
    <div class="flex justify-between items-center mb-5 gap-3">
      <input type="hidden" name="show_archived" id="show-archived-flag" value="0">
      <input type="text" name="q" id="asset-search-input" placeholder="Search by ID or name..."
             class="input input-bordered w-full max-w-md"
             hx-get="/api/v1/assets"
             hx-trigger="keyup changed delay:300ms"
             hx-target="#asset-table-container"
             hx-swap="innerHTML"
             hx-include="this, #show-archived-flag">
      {% if staff.role in ["admin", "in_charge"] %}
      <div id="asset-toolbar-actions" class="flex gap-2 shrink-0">
        <button id="import-asset-btn" class="btn btn-outline rounded-lg"
                hx-get="/api/v1/assets/import-form"
                hx-target="#modal-container"
                hx-swap="innerHTML">
          Import CSV
        </button>
        <button id="add-asset-btn" class="btn btn-primary rounded-lg"
                hx-get="/api/v1/assets/add-form"
                hx-target="#modal-container"
                hx-swap="innerHTML">
          + Add New Item
        </button>
      </div>
      {% endif %}
    </div>

    <div id="asset-table-container"
         hx-get="/api/v1/assets?show_archived=0"
         hx-trigger="load"
         hx-target="this"
         hx-swap="innerHTML">
      <p class="text-base-content/50 py-8 text-center">Loading assets...</p>
    </div>
  </div>

  <div id="modal-container"></div>
</div>

<script>
function switchAssetView(archived, btn) {
  document.getElementById('show-archived-flag').value = archived ? '1' : '0';
  document.getElementById('asset-search-input').value = '';
  document.querySelectorAll('#tab-active, #tab-archived').forEach(t => t.classList.remove('tab-active'));
  btn.classList.add('tab-active');

  const toolbarActions = document.getElementById('asset-toolbar-actions');
  if (toolbarActions) toolbarActions.classList.toggle('hidden', archived);

  updateBulkActionButton();

  htmx.ajax('GET', `/api/v1/assets?show_archived=${archived ? '1' : '0'}`, {
    target: '#asset-table-container',
    swap: 'innerHTML'
  });
}

// Reloads the table using whatever tab/search is currently active, rather
// than a fixed URL -- so restoring/deleting while on the Archived tab (or
// mid-search) refreshes in place instead of silently jumping back to the
// unfiltered Active view. Triggered either by our own bulk-action code
// below (via a manual dispatch) or by any route's HX-Trigger response
// header naming this same event (see restore_asset in assets.py).
document.body.addEventListener('assets-refreshed', function () {
  const archived = document.getElementById('show-archived-flag').value === '1';
  const q = document.getElementById('asset-search-input').value;
  let url = `/api/v1/assets?show_archived=${archived ? '1' : '0'}`;
  if (q) url += `&q=${encodeURIComponent(q)}`;
  htmx.ajax('GET', url, { target: '#asset-table-container', swap: 'innerHTML' });
});

// --- Bulk selection -------------------------------------------------
// The table is swapped wholesale by htmx, so checkboxes inside it come
// and go. Rather than re-binding listeners after every swap, one
// delegated listener on the container (which never gets replaced
// itself) catches every checkbox change, including "select all".

const assetTableContainer = document.getElementById('asset-table-container');

assetTableContainer.addEventListener('change', function (e) {
  if (e.target.id === 'select-all-checkbox') {
    const checked = e.target.checked;
    assetTableContainer.querySelectorAll('.asset-row-checkbox').forEach(cb => {
      cb.checked = checked;
    });
  }
  updateBulkBar();
});

// A fresh table (pagination, search, tab switch, post-import/delete
// refresh) never has anything checked, so just hide the bar rather
// than trying to preserve selection across a full re-render.
assetTableContainer.addEventListener('htmx:afterSwap', updateBulkBar);

function getSelectedAssets() {
  return Array.from(assetTableContainer.querySelectorAll('.asset-row-checkbox:checked'))
    .map(cb => ({ id: cb.value, name: cb.dataset.name, code: cb.dataset.assetCode }));
}

function currentBulkMode() {
  return document.getElementById('show-archived-flag').value === '1' ? 'restore' : 'delete';
}

function updateBulkActionButton() {
  const btn = document.getElementById('bulk-action-btn');
  if (!btn) return;
  if (currentBulkMode() === 'restore') {
    btn.textContent = 'Restore Selected';
    btn.classList.remove('btn-error');
    btn.classList.add('btn-primary');
  } else {
    btn.textContent = 'Delete Selected';
    btn.classList.remove('btn-primary');
    btn.classList.add('btn-error');
  }
}

function openBulkActionModal() {
  const selected = getSelectedAssets();
  if (selected.length === 0) return;

  // Exactly one selected: this is really just a single-item action wearing
  // the bulk UI's clothes. Route it through the same confirm modal + endpoint
  // the row-level "Delete"/"Restore" buttons use, so it gets that flow's
  // toast-on-success (and inline error-on-failure) behavior automatically,
  // instead of duplicating that logic in the bulk result renderer below.
  if (selected.length === 1) {
    const id = selected[0].id;
    const path = currentBulkMode() === 'restore' ? 'restore-confirm' : 'delete-confirm';
    htmx.ajax('GET', `/api/v1/assets/${id}/${path}`, {
      target: '#modal-container',
      swap: 'innerHTML',
    });
    return;
  }

  if (currentBulkMode() === 'restore') {
    openBulkRestoreModal();
  } else {
    openBulkDeleteModal();
  }
}

function updateBulkBar() {
  const selected = getSelectedAssets();
  const bar = document.getElementById('bulk-actions-bar');
  document.getElementById('bulk-selected-count').textContent = selected.length;
  bar.classList.toggle('hidden', selected.length === 0);
  bar.classList.toggle('flex', selected.length > 0);
}

function clearBulkSelection() {
  assetTableContainer.querySelectorAll('.asset-row-checkbox').forEach(cb => { cb.checked = false; });
  const selectAll = document.getElementById('select-all-checkbox');
  if (selectAll) selectAll.checked = false;
  updateBulkBar();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function openBulkDeleteModal() {
  const selected = getSelectedAssets();
  if (selected.length === 0) return;

  const listHtml = selected
    .map(a => `<li>${escapeHtml(a.code)} &mdash; ${escapeHtml(a.name)}</li>`)
    .join('');
  const idsJson = JSON.stringify(selected.map(a => a.id)).replace(/"/g, '&quot;');

  document.getElementById('modal-container').innerHTML = `
    <div class="modal modal-open">
      <div class="modal-box max-w-md">
        <h3 class="font-bold text-lg mb-2">Delete ${selected.length} Asset(s)</h3>
        <p class="text-sm text-base-content/70 mb-3">
          This can be undone later from the Archived tab. Any items currently borrowed will be skipped automatically.
        </p>
        <ul class="text-sm max-h-40 overflow-y-auto list-disc list-inside bg-base-200/50 rounded-lg p-3 mb-4">
          ${listHtml}
        </ul>
        <div class="modal-action">
          <button type="button" class="btn" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
          <button type="button" class="btn btn-error" id="confirm-bulk-delete-btn" data-ids="${idsJson}" onclick="submitBulkDelete(this)">Delete</button>
        </div>
      </div>
    </div>
  `;
}

function submitBulkDelete(btn) {
  const ids = JSON.parse(btn.dataset.ids);
  btn.disabled = true;
  btn.textContent = 'Deleting...';

  const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

  fetch('/api/v1/assets/bulk-delete', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
    body: JSON.stringify({ ids: ids })
  })
    .then(res => res.json())
    .then(data => {
      renderBulkDeleteResults(data);
      clearBulkSelection();
      document.body.dispatchEvent(new Event('assets-refreshed'));
    })
    .catch(() => {
      document.getElementById('modal-container').innerHTML = `
        <div class="modal modal-open">
          <div class="modal-box max-w-sm">
            <h3 class="font-bold text-lg mb-2">Error</h3>
            <p class="text-sm text-error mb-4">Failed to delete assets. Please try again.</p>
            <div class="modal-action">
              <button class="btn" onclick="document.getElementById('modal-container').innerHTML=''">Close</button>
            </div>
          </div>
        </div>`;
    });
}

function renderBulkDeleteResults(data) {
  const skippedHtml = (data.skipped && data.skipped.length)
    ? `<div class="mt-3">
         <p class="text-sm font-semibold mb-1">Skipped</p>
         <ul class="text-sm max-h-32 overflow-y-auto list-disc list-inside bg-error/10 rounded-lg p-3">
           ${data.skipped.map(s => `<li>${escapeHtml(s.asset_id || ('#' + s.id))} &mdash; ${escapeHtml(s.reason)}</li>`).join('')}
         </ul>
       </div>`
    : '';

  document.getElementById('modal-container').innerHTML = `
    <div class="modal modal-open">
      <div class="modal-box max-w-md">
        <h3 class="font-bold text-lg mb-2">Bulk Delete Complete</h3>
        <p class="text-sm text-base-content/70 mb-2">${data.deleted_count} asset(s) deleted.</p>
        ${skippedHtml}
        <div class="modal-action">
          <button class="btn btn-primary" onclick="document.getElementById('modal-container').innerHTML=''">Done</button>
        </div>
      </div>
    </div>
  `;
}

function openBulkRestoreModal() {
  const selected = getSelectedAssets();
  if (selected.length === 0) return;

  const listHtml = selected
    .map(a => `<li>${escapeHtml(a.code)} &mdash; ${escapeHtml(a.name)}</li>`)
    .join('');
  const idsJson = JSON.stringify(selected.map(a => a.id)).replace(/"/g, '&quot;');

  document.getElementById('modal-container').innerHTML = `
    <div class="modal modal-open">
      <div class="modal-box max-w-md">
        <h3 class="font-bold text-lg mb-2">Restore ${selected.length} Asset(s)</h3>
        <p class="text-sm text-base-content/70 mb-3">
          These will be returned to active inventory as <strong>available</strong>. Disposed items will be skipped &mdash; restore those individually to choose a new condition.
        </p>
        <ul class="text-sm max-h-40 overflow-y-auto list-disc list-inside bg-base-200/50 rounded-lg p-3 mb-4">
          ${listHtml}
        </ul>
        <div class="modal-action">
          <button type="button" class="btn" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
          <button type="button" class="btn btn-primary" id="confirm-bulk-restore-btn" data-ids="${idsJson}" onclick="submitBulkRestore(this)">Restore</button>
        </div>
      </div>
    </div>
  `;
}

function submitBulkRestore(btn) {
  const ids = JSON.parse(btn.dataset.ids);
  btn.disabled = true;
  btn.textContent = 'Restoring...';

  const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

  fetch('/api/v1/assets/bulk-restore', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
    body: JSON.stringify({ ids: ids })
  })
    .then(res => res.json())
    .then(data => {
      renderBulkRestoreResults(data);
      clearBulkSelection();
      document.body.dispatchEvent(new Event('assets-refreshed'));
    })
    .catch(() => {
      document.getElementById('modal-container').innerHTML = `
        <div class="modal modal-open">
          <div class="modal-box max-w-sm">
            <h3 class="font-bold text-lg mb-2">Error</h3>
            <p class="text-sm text-error mb-4">Failed to restore assets. Please try again.</p>
            <div class="modal-action">
              <button class="btn" onclick="document.getElementById('modal-container').innerHTML=''">Close</button>
            </div>
          </div>
        </div>`;
    });
}

function renderBulkRestoreResults(data) {
  const skippedHtml = (data.skipped && data.skipped.length)
    ? `<div class="mt-3">
         <p class="text-sm font-semibold mb-1">Skipped</p>
         <ul class="text-sm max-h-32 overflow-y-auto list-disc list-inside bg-error/10 rounded-lg p-3">
           ${data.skipped.map(s => `<li>${escapeHtml(s.asset_id || ('#' + s.id))} &mdash; ${escapeHtml(s.reason)}</li>`).join('')}
         </ul>
       </div>`
    : '';

  document.getElementById('modal-container').innerHTML = `
    <div class="modal modal-open">
      <div class="modal-box max-w-md">
        <h3 class="font-bold text-lg mb-2">Bulk Restore Complete</h3>
        <p class="text-sm text-base-content/70 mb-2">${data.restored_count} asset(s) restored.</p>
        ${skippedHtml}
        <div class="modal-action">
          <button class="btn btn-primary" onclick="document.getElementById('modal-container').innerHTML=''">Done</button>
        </div>
      </div>
    </div>
  `;
}
</script>
{% endblock %}
