<!-- Newest-first (filenames sort chronologically since the timestamp is baked
     in, see routes/staff.py's _list_backups()). "Backup Now" reloads the whole
     page rather than swapping this in, so it only renders once per modal open. -->
{% for b in backups %}
<div class="flex items-center justify-between gap-3 px-3 py-2 text-sm">
  <div class="min-w-0">
    <p class="font-medium truncate">{{ b.name }}</p>
    <p class="text-xs text-base-content/40">{{ b.created_at | format_date }} &middot; {{ "%.1f"|format(b.size_bytes / 1048576) }} MB</p>
  </div>
  <div class="flex items-center gap-1 shrink-0">
    <a href="/api/v1/backup-settings/download/{{ b.name }}" class="btn btn-ghost btn-xs" download>
      Download
    </a>
    <!-- Styled modal (not a native hx-confirm) since this delete is permanent
         (no undo/archive) and now also requires the acting admin's password --
         see staff/_backup_delete_modal.html. Appended to <body> (not swapped
         into #modal-container) since this list already lives inside the
         backup-settings modal in #modal-container - targeting that again
         would blow away the list this button is sitting in. -->
    <button type="button" class="btn btn-ghost btn-xs text-error"
            hx-get="/api/v1/backup-settings/delete-confirm/{{ b.name }}"
            hx-target="body"
            hx-swap="beforeend">
      Delete
    </button>
  </div>
</div>
{% else %}
<p class="text-sm text-base-content/40 text-center py-4">No backups yet.</p>
{% endfor %}
