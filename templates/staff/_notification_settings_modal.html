<div class="modal modal-open">
  <div class="modal-box max-w-md">

    <div class="flex justify-between items-start mb-5">
      <div>
        <h3 class="font-bold text-xl">Notification Settings</h3>
        <p class="text-sm text-base-content/50 mt-1">Controls when a "due soon" alert fires for a borrowed item.</p>
      </div>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>

    <!-- Always rendered (not just when there is an error), invisible (not
         removed) when empty - reserves the alert box's layout space so
         content below never jumps when an error appears. -->
    <div class="alert alert-error text-sm mb-4 py-2 {% if not error %}invisible{% endif %}">{{ error or '' }}</div>

    <form id="notification-settings-form"
          hx-post="/api/v1/notification-settings/update"
          hx-target="#global-modal-container"
          hx-swap="innerHTML"
          class="space-y-4">

      <div>
        <label class="text-xs font-semibold text-base-content/50 tracking-wide">DUE-SOON THRESHOLD (HOURS)</label>
        <input type="number" name="due_soon_hours" min="1" max="168" required
               value="{{ due_soon_hours }}"
               class="input input-bordered input-sm w-full mt-1">
        <p class="text-xs text-base-content/40 mt-1">
          A "due soon" notification fires once a borrowed item's due date is within this many hours. Once the due date actually passes, it becomes an "overdue" alert instead. Checked every 15 minutes.
        </p>
      </div>

      <div class="modal-action flex justify-end items-center gap-2 mt-6">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('global-modal-container').innerHTML=''">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </div>
    </form>
  </div>
</div>
