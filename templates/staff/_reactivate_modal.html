<div class="modal modal-open">
  <div class="modal-box max-w-sm max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-start mb-2">
      <h3 class="font-bold text-lg">Reactivate Staff Account</h3>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>
    <p class="text-sm text-base-content/70 mb-4">
      Reactivate <strong>{{ full_name(staff_member.first_name, staff_member.last_name, staff_member.middle_name, staff_member.suffix) }}</strong>'s account?
      They'll be able to log in again.
    </p>

    <div id="reactivate-staff-error" class="alert alert-error text-sm mb-3 py-2 hidden"></div>

    <!-- Reason only here -- entering it and confirming your password are two
         separate steps (see openReactivateStaffPasswordConfirm below), same
         split as /feature-flags/update's Save Changes -> password dialog.
         Reactivating an account (any role: admin, in_charge, tool_keeper) is
         security-sensitive enough to require both, not just a click. -->
    <div class="form-control mb-2">
      <label class="label"><span class="label-text">Reason <span class="text-error">*</span></span></label>
      <textarea id="reactivate-staff-reason" rows="2" required
                placeholder="Why is this account being reactivated?"
                class="textarea textarea-bordered w-full"></textarea>
    </div>

    <div class="modal-action">
      <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
      <button type="button" class="btn btn-success" onclick="openReactivateStaffPasswordConfirm({{ staff_member.id }})">Reactivate</button>
    </div>
  </div>
</div>

<!-- Shown only after Reactivate, so the reason is entered first and only
     then does the acting admin prove it's them. Submits straight to
     /api/v1/staff/<id>/reactivate's JSON body ({current_password, reason}). -->
<dialog id="reactivate-staff-confirm-dialog" class="modal">
  <div class="modal-box max-w-sm">
    <h3 class="font-bold text-lg mb-1">Confirm your password</h3>
    <p class="text-xs text-base-content/50 mb-3">Re-enter your password to reactivate this account.</p>

    <div id="reactivate-staff-confirm-error" class="hidden alert alert-error text-sm mb-3 py-2"></div>

    <!-- Wrapped in its own form so Enter submits it, matching every other
         password prompt in the app instead of requiring a click on Confirm. -->
    <form onsubmit="submitReactivateStaffForm(event); return false;">
      <input type="password" id="reactivate-staff-confirm-password" placeholder="Current password"
             autocomplete="current-password" class="input input-bordered input-sm w-full">

      <div class="modal-action">
        <button type="button" class="btn btn-outline btn-sm" onclick="document.getElementById('reactivate-staff-confirm-dialog').close()">Cancel</button>
        <button type="submit" id="reactivate-staff-confirm-submit-btn" class="btn btn-success btn-sm">Confirm</button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
let reactivateStaffPendingId = null;

function openReactivateStaffPasswordConfirm(id) {
  const reason = document.getElementById('reactivate-staff-reason').value.trim();
  const errorBox = document.getElementById('reactivate-staff-error');
  errorBox.classList.add('hidden');

  if (!reason) {
    errorBox.textContent = 'A reason is required to reactivate this account';
    errorBox.classList.remove('hidden');
    return;
  }

  reactivateStaffPendingId = id;
  document.getElementById('reactivate-staff-confirm-password').value = '';
  document.getElementById('reactivate-staff-confirm-error').classList.add('hidden');
  document.getElementById('reactivate-staff-confirm-dialog').showModal();
}

// Same fetch+CSRF+reload shape as staff/_delete_modal.html's
// submitDeleteStaffForm, plus the password-dialog step from
// /feature-flags/update.
async function submitReactivateStaffForm(event) {
  if (event) event.preventDefault();
  const errorEl = document.getElementById('reactivate-staff-confirm-error');
  errorEl.classList.add('hidden');

  const password = document.getElementById('reactivate-staff-confirm-password').value;
  if (!password) {
    errorEl.textContent = 'Enter your password to confirm this change';
    errorEl.classList.remove('hidden');
    return;
  }

  const reason = document.getElementById('reactivate-staff-reason').value.trim();
  const id = reactivateStaffPendingId;

  // Reactivating removes this row from the Inactive filter it was almost
  // certainly opened from (that's the only view a deactivated account's
  // Reactivate action is reachable from), which can otherwise look like
  // the click did nothing or reset the filter -- read here, before the
  // reload below, since the toggle is a sibling of this modal in the
  // page, not part of it. Checked defensively (?.) since the table row
  // action (staff/_table.html) can also reach this modal from a context
  // where that toggle might not be on screen.
  const wasViewingInactive = document.getElementById('show-inactive-toggle')?.checked;
  // currentStaffStatusFilter (declared in staff.html) is the single
  // source of truth for "which stat-card/toggle state is active" --
  // unlike the address bar, it's updated synchronously and doesn't
  // depend on an htmx:configRequest listener having already run before
  // this modal's Reactivate button is clicked. Reading it here (rather
  // than trusting window.location.reload() to replay whatever the URL
  // already happens to contain) is what actually keeps the reload landed
  // on the Inactive filter instead of silently falling back to the
  // unfiltered/Active view.
  const staffStatusFilter = typeof currentStaffStatusFilter !== 'undefined' ? currentStaffStatusFilter : null;

  const btn = document.getElementById('reactivate-staff-confirm-submit-btn');
  btn.disabled = true;

  try {
    const res = await fetch(`/api/v1/staff/${id}/reactivate`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
      },
      body: JSON.stringify({ current_password: password, reason: reason }),
    });
    const result = await res.json();

    if (!res.ok) {
      errorEl.textContent = result.error || "That account couldn't be reactivated";
      errorEl.classList.remove('hidden');
      btn.disabled = false;
      return;
    }

    const message = wasViewingInactive
      ? 'Staff account reactivated -- still viewing the Inactive filter'
      : 'Staff account reactivated';
    sessionStorage.setItem('pending-toast', JSON.stringify({ message: message, type: 'success' }));

    // Rebuild the URL from staffStatusFilter rather than trusting the
    // address bar to already be in sync -- see the comment above. This is
    // still a full navigation (not an htmx table refresh) because the
    // stat cards at the top of the page also need to reflect the change,
    // same reasoning as the bulk reactivate/deactivate actions below.
    const url = new URL(window.location.href);
    if (staffStatusFilter === 'inactive') {
      url.searchParams.set('show_inactive', '1');
      url.searchParams.set('status', 'inactive');
    } else if (staffStatusFilter) {
      url.searchParams.set('show_inactive', '0');
      url.searchParams.set('status', staffStatusFilter);
    } else if (staffStatusFilter === '') {
      url.searchParams.set('show_inactive', '0');
      url.searchParams.delete('status');
    }
    // staffStatusFilter === null (currentStaffStatusFilter undefined --
    // this modal reached from somewhere other than the Staff page) falls
    // through untouched, same as the old blind reload().
    window.location.href = url.pathname + '?' + url.searchParams.toString();
  } catch (err) {
    errorEl.textContent = "That account couldn't be reactivated";
    errorEl.classList.remove('hidden');
    btn.disabled = false;
  }
}
</script>
