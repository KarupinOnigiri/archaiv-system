{% macro render_load_more(next_offset) %}
<li class="border-t border-base-300">
  <a class="flex items-center justify-center px-3 py-2 text-sm font-medium text-primary hover:bg-base-200 cursor-pointer"
     hx-get="/api/v1/staff/eligible-members-search"
     hx-target="closest li"
     hx-swap="outerHTML"
     hx-vals='{"browse": "1", "append": "1", "offset": {{ next_offset }}}'>
    Load more
  </a>
</li>
{% endmacro %}
