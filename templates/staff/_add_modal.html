<div class="modal modal-open">
  <!-- Wider than usual (max-w-4xl) so most fields fit side by side; still
       capped/scrolling like every other modal rather than growing past the viewport. -->
  <div class="modal-box max-w-4xl p-0 flex flex-col max-h-[85vh]">

    <div class="p-6 pb-4 shrink-0">
      <div class="flex justify-between items-start">
        <div>
          <h3 class="font-bold text-xl">Add New Staff</h3>
          <p class="text-sm text-base-content/50 mt-1">Grant system access to an existing member.</p>
        </div>
        <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
                onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
      </div>

      <!-- Always in the DOM, just `invisible` when empty -- keeps its height
           reserved so the layout doesn't jump when an error appears. -->
      <div id="add-staff-error" class="alert alert-error text-sm mt-4 py-2 invisible"></div>
    </div>

    <div class="flex-1 overflow-y-auto min-h-0">
    <form id="add-staff-form" onsubmit="submitAddStaffForm(event)">
      <div class="px-6 pb-2">
      <div class="bg-base-200/50 rounded-xl p-5 space-y-4">

        <div>
          <label class="text-xs font-semibold text-base-content/50 tracking-wide">MEMBER <span class="text-error">*</span></label>

          <!-- Shown once a member has been picked from the search results below. -->
          <div id="member-picker-selected" class="hidden mt-1 items-center justify-between gap-2 bg-base-100 border border-primary/30 rounded-lg px-3 py-2.5">
            <p id="member-picker-selected-name" class="text-sm font-medium truncate"></p>
            <button type="button" class="btn btn-ghost btn-xs shrink-0" onclick="clearEligibleMember()">Change</button>
          </div>

          <!-- Type-ahead search instead of a preloaded <select> -- a full dropdown
               stops scaling once there are enough members. Also doubles as the
               barcode-scanner input, since scanners just type the code + Enter. -->
          <div id="member-picker-search-wrap" class="mt-1 relative">
            <input type="text" id="member-search-input" placeholder="Search by name, member code, or barcode..." autocomplete="off"
                   class="input input-bordered w-full bg-base-100"
                   name="q"
                   hx-get="/api/v1/staff/eligible-members-search"
                   hx-trigger="keyup changed delay:300ms"
                   hx-target="#eligible-member-results"
                   hx-swap="innerHTML"
                   hx-include="this">
            <div class="flex items-center gap-2 mt-1.5">
              <button type="button" id="browse-all-members-btn"
                      class="text-xs font-medium text-primary hover:underline"
                      onclick="document.getElementById('member-search-input').value = '';"
                      hx-get="/api/v1/staff/eligible-members-search"
                      hx-target="#eligible-member-results"
                      hx-swap="innerHTML"
                      hx-vals='{"browse": "1"}'>
                Browse all eligible members
              </button>
              <button type="button" id="clear-member-picker-btn"
                      class="btn btn-ghost btn-circle text-error hover:bg-error/10 hidden w-4 h-4 min-h-0 p-0"
                      aria-label="Clear results" data-tooltip="Clear results"
                      onclick="dismissEligibleMemberResults()">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-2.5 h-2.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
              </button>
            </div>
            <div id="eligible-member-results" class="absolute z-20 w-full mt-1"></div>
          </div>

          <input type="hidden" id="member-id-input" name="member_id">
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">USERNAME <span class="text-error">*</span></label>
            <input type="text" name="username" required placeholder="e.g. jdelacruz" autocomplete="off"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">TEMPORARY PASSWORD <span class="text-error">*</span></label>
            <input type="password" name="password" required placeholder="At least 8 characters" autocomplete="new-password"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">ROLE <span class="text-error">*</span></label>
            <select name="role" id="add-staff-role" required class="select select-bordered w-full mt-1 bg-base-100"
                    onchange="handleAddStaffRoleChange(this)">
              <option value="" disabled selected hidden>Select Role</option>
              <option value="tool_keeper">Tool Keeper</option>
              <option value="in_charge">In Charge</option>
              <option value="admin">Admin</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">ASSIGNED START</label>
            <input type="date" name="assigned_start" id="add-staff-assigned-start" class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">ASSIGNED END</label>
            <input type="date" name="assigned_end" id="add-staff-assigned-end" class="input input-bordered w-full mt-1 bg-base-100">
          </div>
        </div>
        <!-- Quick-set shortcuts for the three durations staff get assigned most
             often. "Permanent" writes the PERMANENT_ASSIGNED_END sentinel instead
             of leaving assigned_end blank -- blank still means "not set, can't
             log in" for a Tool Keeper (see routes/auth.py's login()). -->
        <div class="flex flex-wrap gap-2 -mt-2">
          <button type="button" class="btn btn-xs btn-outline" onclick="setAddStaffAssignedPreset('permanent')">Permanent</button>
          <button type="button" class="btn btn-xs btn-outline" onclick="setAddStaffAssignedPreset(180)">6 Months</button>
          <button type="button" class="btn btn-xs btn-outline" onclick="setAddStaffAssignedPreset(365)">1 Year</button>
        </div>
        <p class="text-xs text-base-content/40 -mt-2">Optional for Admin/In Charge; a Tool Keeper needs both dates set before they can sign in.</p>

        <div class="bg-info/10 rounded-lg p-3 flex gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-info shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <p class="text-xs text-info/80">A staff code (e.g. STF00042) is generated automatically once this account is saved.</p>
        </div>

      </div>
      </div>

      <div class="modal-action flex justify-between items-center border-t border-base-300 px-6 py-4 m-0 sticky bottom-0 bg-base-100">
        <button type="button" onclick="document.getElementById('add-staff-form').reset(); clearEligibleMember();" class="text-sm text-base-content/50 hover:text-base-content">
          Clear form
        </button>
        <div class="flex gap-2">
          <button type="button" class="btn" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Staff</button>
        </div>
      </div>
    </form>
    </div>
  </div>
</div>

<script>
// Start defaults to today only if it's still empty, so re-clicking a different
// preset after already picking a start date doesn't stomp on it.
const ADD_STAFF_PERMANENT_ASSIGNED_END = {{ PERMANENT_ASSIGNED_END | tojson }};

function formatDateLocalAddStaff(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function setAddStaffAssignedPreset(preset) {
  const startInput = document.getElementById('add-staff-assigned-start');
  const endInput = document.getElementById('add-staff-assigned-end');
  if (!startInput.value) startInput.value = formatDateLocalAddStaff(new Date());

  if (preset === 'permanent') {
    endInput.value = ADD_STAFF_PERMANENT_ASSIGNED_END;
    return;
  }
  const end = new Date(startInput.value + 'T00:00:00');
  end.setDate(end.getDate() + preset);
  endInput.value = formatDateLocalAddStaff(end);
}

// Admin defaults to Permanent the moment that role is picked -- the profile
// modal already displays every admin as Permanent regardless, so leaving the
// actual columns null was a gap between the record and how it's shown
// elsewhere. Only fires when both fields are still empty, so it won't stomp
// on dates someone already picked before landing on Admin.
function handleAddStaffRoleChange(select) {
  if (select.value !== 'admin') return;
  const startInput = document.getElementById('add-staff-assigned-start');
  const endInput = document.getElementById('add-staff-assigned-end');
  if (!startInput.value && !endInput.value) {
    setAddStaffAssignedPreset('permanent');
  }
}

// Clicking a search result calls this to record the choice and swap the search
// box for a confirmation card. Reads id/label off data-* attributes rather than
// inline JS-string args -- interpolating a name into onclick="...(...)" isn't
// safe if it ever contains a quote character.
function selectEligibleMember(el) {
  const id = el.dataset.memberId;
  const label = el.dataset.memberLabel;
  document.getElementById('member-id-input').value = id;
  document.getElementById('member-picker-selected-name').textContent = label;
  document.getElementById('member-picker-selected').classList.remove('hidden');
  document.getElementById('member-picker-selected').classList.add('flex');
  document.getElementById('member-picker-search-wrap').classList.add('hidden');
  document.getElementById('eligible-member-results').innerHTML = '';
}

function clearEligibleMember() {
  document.getElementById('member-id-input').value = '';
  document.getElementById('member-picker-selected').classList.add('hidden');
  document.getElementById('member-picker-selected').classList.remove('flex');
  document.getElementById('member-picker-search-wrap').classList.remove('hidden');
  const input = document.getElementById('member-search-input');
  input.value = '';
  input.focus();
}

// Closes the results dropdown without picking anyone. Only clears the results
// panel, not the search input, so a partially-typed name isn't lost.
function dismissEligibleMemberResults() {
  const results = document.getElementById('eligible-member-results');
  if (results) results.innerHTML = '';
}

// Rather than toggling the clear button by hand everywhere the results list
// can change, a MutationObserver just watches the container and shows/hides
// it automatically.
(function () {
  const results = document.getElementById('eligible-member-results');
  const clearBtn = document.getElementById('clear-member-picker-btn');
  if (!results || !clearBtn) return;
  function syncClearBtn() {
    clearBtn.classList.toggle('hidden', results.children.length === 0);
  }
  new MutationObserver(syncClearBtn).observe(results, { childList: true });
  syncClearBtn();
})();

// Click outside the search box/results closes the dropdown. Guarded so
// reopening this modal repeatedly doesn't stack duplicate listeners.
if (!window.__eligibleMemberDismissListenerAdded) {
  window.__eligibleMemberDismissListenerAdded = true;
  document.addEventListener('click', function (e) {
    const wrap = document.getElementById('member-picker-search-wrap');
    if (!wrap || wrap.classList.contains('hidden')) return;
    if (!wrap.contains(e.target)) {
      dismissEligibleMemberResults();
    }
  });
}

// Escape in the search box dismisses just the dropdown -- stopPropagation keeps
// it from also triggering base.html's Escape handler and closing the whole form.
document.getElementById('member-search-input').addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    e.stopPropagation();
    dismissEligibleMemberResults();
    e.target.blur();
  }
});

// /api/v1/staff/add is JSON-only (no HTML re-render on error), so this posts
// via fetch and shows errors inline instead of relying on a server re-render.
async function submitAddStaffForm(event) {
  event.preventDefault();
  const form = document.getElementById('add-staff-form');
  const errorBox = document.getElementById('add-staff-error');
  errorBox.classList.add('invisible');

  const memberId = document.getElementById('member-id-input').value;
  if (!memberId) {
    errorBox.textContent = 'Search for and select a member first.';
    errorBox.classList.remove('invisible');
    return;
  }

  const payload = {
    member_id: memberId,
    username: form.username.value.trim(),
    password: form.password.value,
    role: form.role.value,
    assigned_start: form.assigned_start.value || null,
    assigned_end: form.assigned_end.value || null,
  };

  try {
    const res = await fetch('/api/v1/staff/add', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
      },
      body: JSON.stringify(payload),
    });
    const result = await res.json();

    if (!res.ok) {
      errorBox.textContent = result.error || "That account couldn't be created";
      errorBox.classList.remove('invisible');
      return;
    }

    sessionStorage.setItem('pending-toast', JSON.stringify({
      message: `Staff added (${result.staff_code})`,
      type: 'success',
    }));
    window.location.reload();
  } catch (err) {
    errorBox.textContent = "That account couldn't be created";
    errorBox.classList.remove('invisible');
  }
}
</script>
