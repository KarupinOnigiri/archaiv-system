<div class="modal modal-open">
  <div class="modal-box max-w-sm max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-start mb-2">
      <h3 class="font-bold text-lg">Lock Staff Account</h3>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>
    <p class="text-sm text-base-content/70 mb-4">
      <strong>{{ full_name(staff_member.first_name, staff_member.last_name, staff_member.middle_name, staff_member.suffix) }}</strong>
      won't be able to log in until this lock is lifted, either by an admin unlocking it or the timer running out.
    </p>

    <div id="lock-staff-error" class="alert alert-error text-sm mb-3 py-2 hidden"></div>

    <p class="text-xs font-semibold text-base-content/50 tracking-wide mb-2">DURATION</p>
    <div id="lock-duration-presets" class="grid grid-cols-3 gap-2 mb-3">
      <button type="button" class="btn btn-outline btn-sm lock-preset-btn" data-minutes="15">15 min</button>
      <button type="button" class="btn btn-outline btn-sm lock-preset-btn" data-minutes="60">1 hour</button>
      <button type="button" class="btn btn-outline btn-sm lock-preset-btn" data-minutes="1440">24 hours</button>
      <button type="button" class="btn btn-outline btn-sm lock-preset-btn" data-minutes="10080">7 days</button>
      <button type="button" class="btn btn-outline btn-sm lock-preset-btn" data-minutes="43200">30 days</button>
      <button type="button" class="btn btn-outline btn-sm lock-preset-btn" id="lock-preset-indefinite" data-minutes="indefinite">Indefinite</button>
    </div>

    <label class="form-control w-full">
      <span class="label-text text-xs text-base-content/60">Or enter a custom duration (minutes)</span>
      <input type="number" id="lock-custom-minutes" min="1" step="1" placeholder="e.g. 120"
             class="input input-bordered input-sm w-full mt-1">
    </label>

    <div id="lock-selection-summary" class="text-sm text-base-content/70 mt-3 hidden">
      Locking for <span id="lock-selection-summary-text" class="font-medium text-base-content"></span>.
    </div>

    <div class="modal-action">
      <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
      <button type="button" class="btn btn-error" id="lock-staff-submit-btn" disabled onclick="submitLockStaffForm({{ staff_member.id }})">Lock Account</button>
    </div>
  </div>
</div>

<script>
(function () {
  // Presets and the custom-minutes field are two inputs for the same one
  // value - clicking a preset fills/clears the custom field's "active"
  // look instead of the two disagreeing about what's actually selected.
  const presetButtons = Array.from(document.querySelectorAll('.lock-preset-btn'));
  const customInput = document.getElementById('lock-custom-minutes');
  const submitBtn = document.getElementById('lock-staff-submit-btn');
  const summaryBox = document.getElementById('lock-selection-summary');
  const summaryText = document.getElementById('lock-selection-summary-text');

  let selected = null; // { indefinite: true } or { minutes: <number> }

  function formatDuration(minutes) {
    if (minutes % 43200 === 0 && minutes >= 43200) return `${minutes / 43200} month${minutes / 43200 === 1 ? '' : 's'}`;
    if (minutes % 1440 === 0 && minutes >= 1440) return `${minutes / 1440} day${minutes / 1440 === 1 ? '' : 's'}`;
    if (minutes % 60 === 0 && minutes >= 60) return `${minutes / 60} hour${minutes / 60 === 1 ? '' : 's'}`;
    return `${minutes} minute${minutes === 1 ? '' : 's'}`;
  }

  function updateSummary() {
    if (!selected) {
      summaryBox.classList.add('hidden');
      submitBtn.disabled = true;
      return;
    }
    submitBtn.disabled = false;
    summaryBox.classList.remove('hidden');
    summaryText.textContent = selected.indefinite ? 'indefinitely' : formatDuration(selected.minutes);
  }

  presetButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      customInput.value = '';
      presetButtons.forEach(function (b) { b.classList.remove('btn-error'); b.classList.add('btn-outline'); });
      btn.classList.remove('btn-outline');
      btn.classList.add('btn-error');
      selected = btn.dataset.minutes === 'indefinite'
        ? { indefinite: true }
        : { minutes: parseInt(btn.dataset.minutes, 10) };
      updateSummary();
    });
  });

  customInput.addEventListener('input', function () {
    const value = parseInt(customInput.value, 10);
    presetButtons.forEach(function (b) { b.classList.remove('btn-error'); b.classList.add('btn-outline'); });
    if (customInput.value.trim() === '' || isNaN(value) || value <= 0) {
      selected = null;
    } else {
      selected = { minutes: value };
    }
    updateSummary();
  });

  window.submitLockStaffForm = async function (id) {
    if (!selected) return;
    const errorBox = document.getElementById('lock-staff-error');
    errorBox.classList.add('hidden');
    submitBtn.disabled = true;

    const body = selected.indefinite ? { indefinite: true } : { duration_minutes: selected.minutes };

    try {
      const res = await fetch(`/api/v1/staff/${id}/lock`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
        },
        body: JSON.stringify(body),
      });
      const result = await res.json();

      if (!res.ok) {
        errorBox.textContent = result.error || "That account couldn't be locked";
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        return;
      }

      sessionStorage.setItem('pending-toast', JSON.stringify({ message: 'Staff account locked', type: 'success' }));
      window.location.reload();
    } catch (err) {
      errorBox.textContent = "That account couldn't be locked";
      errorBox.classList.remove('hidden');
      submitBtn.disabled = false;
    }
  };
})();
</script>
