<div class="modal modal-open">
  <div class="modal-box max-w-md">

    <div class="flex justify-between items-start mb-5">
      <div>
        <h3 class="font-bold text-xl">Reassign Usage</h3>
        <p class="text-sm text-base-content/50 mt-1">
          {{ full_name(staff_member.first_name, staff_member.last_name, staff_member.middle_name, staff_member.suffix) }}
          &middot; {{ staff_member.staff_code or "-" }}
        </p>
      </div>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>

    <div id="reassign-usage-error" class="alert alert-error text-sm mb-4 py-2 hidden"></div>

    <form id="reassign-usage-form" onsubmit="submitReassignUsageForm(event, {{ staff_member.id }})">
      <div class="bg-base-200/50 rounded-xl p-5 space-y-4">

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">ASSIGNED START</label>
            <input type="date" name="assigned_start" id="reassign-start" value="{{ staff_member.assigned_start or '' }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">ASSIGNED END</label>
            <input type="date" name="assigned_end" id="reassign-end" value="{{ staff_member.assigned_end or '' }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
        </div>

        <!-- Quick-extend shortcuts: each button counts N days from ASSIGNED START
             (not today/existing end), so re-clicking always lands exactly N days
             after start instead of stacking on the previous click. -->
        <div>
          <p class="text-xs font-semibold text-base-content/50 tracking-wide mb-1.5">QUICK EXTEND <span class="font-normal normal-case text-base-content/40">(from assigned start)</span></p>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="btn btn-xs btn-outline" onclick="extendReassignEnd(30)">+30 days</button>
            <button type="button" class="btn btn-xs btn-outline" onclick="extendReassignEnd(60)">+60 days</button>
            <button type="button" class="btn btn-xs btn-outline" onclick="extendReassignEnd(90)">+90 days</button>
            <button type="button" class="btn btn-xs btn-outline" onclick="extendReassignEnd(180)">+6 months</button>
            <button type="button" class="btn btn-xs btn-outline" onclick="extendReassignEnd(365)">+1 year</button>
            <!-- Sets assigned_end to the PERMANENT_ASSIGNED_END sentinel instead of a day
                 count - login()'s tool_keeper check needs *some* assigned_end, this is
                 just one far enough out to never matter. -->
            <button type="button" class="btn btn-xs btn-outline" onclick="setReassignPermanent()">Permanent</button>
            <!-- Separated visually from the quick-extend group - wipes both fields
                 blank instead of computing a date, for undoing an accidental click
                 or leaving the account dateless again. -->
            <button type="button" class="btn btn-xs btn-outline btn-error ml-auto" onclick="clearReassignDates()">Clear</button>
          </div>
        </div>

      </div>

      <div class="modal-action flex justify-end gap-2 mt-6">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script>
const REASSIGN_PERMANENT_ASSIGNED_END = {{ PERMANENT_ASSIGNED_END | tojson }};

// toISOString() converts to UTC first, so for anyone east of UTC (e.g. UTC+8) a local
// midnight Date rolls back to the previous calendar day - that's why +30 days was
// landing on +28. Local date parts, not UTC, avoid that entirely.
function toLocalDateStr(date) {
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
}

function setReassignPermanent() {
  const startInput = document.getElementById('reassign-start');
  if (!startInput.value) startInput.value = toLocalDateStr(new Date());
  document.getElementById('reassign-end').value = REASSIGN_PERMANENT_ASSIGNED_END;
}

function extendReassignEnd(days) {
  const startInput = document.getElementById('reassign-start');
  const endInput = document.getElementById('reassign-end');

  // Fills ASSIGNED START with today if blank - common right after a deactivate/
  // reactivate, which nulls both dates out (see routes/staff.py).
  if (!startInput.value) {
    startInput.value = toLocalDateStr(new Date());
  }

  // Always counts from ASSIGNED START (not today or the existing end) so re-clicking
  // recomputes fresh instead of stacking. Uses a freshly-parsed Date rather than
  // mutating startInput's own value, avoiding the old aliasing bug (see git history).
  const base = new Date(startInput.value + 'T00:00:00');
  base.setDate(base.getDate() + days);
  endInput.value = toLocalDateStr(base);
}

// Wipes both date fields blank - undo an accidental quick-extend click, or
// leave the account dateless again, without clearing each picker by hand.
function clearReassignDates() {
  document.getElementById('reassign-start').value = '';
  document.getElementById('reassign-end').value = '';
}

// Mirrors submitEditStaffForm's fetch-based JSON submit but only sends
// assigned_start/assigned_end - /staff/<id>/edit leaves other fields untouched.
async function submitReassignUsageForm(event, id) {
  event.preventDefault();
  const form = document.getElementById('reassign-usage-form');
  const errorBox = document.getElementById('reassign-usage-error');
  errorBox.classList.add('hidden');

  const payload = {
    assigned_start: form.assigned_start.value || null,
    assigned_end: form.assigned_end.value || null,
  };

  try {
    const res = await fetch(`/api/v1/staff/${id}/edit`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
      },
      body: JSON.stringify(payload),
    });
    const result = await res.json();

    if (!res.ok) {
      errorBox.textContent = result.error || "That account's usage couldn't be reassigned";
      errorBox.classList.remove('hidden');
      return;
    }

    sessionStorage.setItem('pending-toast', JSON.stringify({ message: 'Usage reassigned', type: 'success' }));
    window.location.reload();
  } catch (err) {
    errorBox.textContent = "That account's usage couldn't be reassigned";
    errorBox.classList.remove('hidden');
  }
}
</script>
