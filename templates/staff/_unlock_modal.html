<div class="modal modal-open">
  <div class="modal-box max-w-sm max-h-[85vh] overflow-y-auto">
    <div class="flex justify-between items-start mb-2">
      <h3 class="font-bold text-lg">Unlock Staff Account</h3>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>
    <p class="text-sm text-base-content/70 mb-4">
      Clear the lockout on <strong>{{ full_name(staff_member.first_name, staff_member.last_name, staff_member.middle_name, staff_member.suffix) }}</strong>'s account? They'll be able to sign in again immediately.
    </p>

    <div id="unlock-staff-error" class="alert alert-error text-sm mb-3 py-2 hidden"></div>

    <div class="modal-action">
      <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
      <button type="button" class="btn btn-warning" onclick="submitUnlockStaffForm({{ staff_member.id }})">Unlock</button>
    </div>
  </div>
</div>

<script>
// Same fetch+CSRF+reload shape as submitDeleteStaffForm in _delete_modal.html
// -- POST /api/v1/staff/<id>/unlock reads no body, so a plain fetch is enough.
async function submitUnlockStaffForm(id) {
  const errorBox = document.getElementById('unlock-staff-error');
  errorBox.classList.add('hidden');

  try {
    const res = await fetch(`/api/v1/staff/${id}/unlock`, {
      method: 'POST',
      headers: {
        'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
      },
    });
    const result = await res.json();

    if (!res.ok) {
      errorBox.textContent = result.error || "That account couldn't be unlocked";
      errorBox.classList.remove('hidden');
      return;
    }

    sessionStorage.setItem('pending-toast', JSON.stringify({ message: 'Staff account unlocked', type: 'success' }));
    window.location.reload();
  } catch (err) {
    errorBox.textContent = "That account couldn't be unlocked";
    errorBox.classList.remove('hidden');
  }
}
</script>
