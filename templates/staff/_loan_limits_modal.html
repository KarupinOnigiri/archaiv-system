<div class="modal modal-open">
  <div class="modal-box max-w-md">

    <div class="flex justify-between items-start mb-5">
      <div>
        <h3 class="font-bold text-xl">Manage Loan Limits</h3>
        <p class="text-sm text-base-content/50 mt-1">Maximum tools a member can have borrowed at once, by member type.</p>
      </div>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>

    <!-- Always rendered (not just when there is an error), invisible (not
         removed) when empty -- reserves the alert box's layout space so
         content below never jumps when an error appears. -->
    <div class="alert alert-error text-sm mb-4 py-2 {% if not error %}invisible{% endif %}">{{ error or '' }}</div>

    <form id="loan-limits-form"
          hx-post="/api/v1/loan-limits/update"
          hx-target="#modal-container"
          hx-swap="innerHTML"
          class="space-y-4">

      {% set trainee_limit = limits | selectattr("member_type", "equalto", "trainee") | first %}
      {% set trainer_limit = limits | selectattr("member_type", "equalto", "trainer") | first %}

      <div>
        <label class="text-xs font-semibold text-base-content/50 tracking-wide">TRAINEE - max concurrent loans</label>
        <input type="number" name="max_concurrent_loans_trainee" min="1" required
               value="{{ trainee_limit.max_concurrent_loans if trainee_limit else 10 }}"
               class="input input-bordered input-sm w-full mt-1">
      </div>

      <div>
        <label class="text-xs font-semibold text-base-content/50 tracking-wide">TRAINER - max concurrent loans</label>
        <input type="number" name="max_concurrent_loans_trainer" min="1" required
               value="{{ trainer_limit.max_concurrent_loans if trainer_limit else 10 }}"
               class="input input-bordered input-sm w-full mt-1">
      </div>

      <div class="modal-action flex justify-end items-center gap-2 mt-6">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Limits</button>
      </div>
    </form>
  </div>
</div>
