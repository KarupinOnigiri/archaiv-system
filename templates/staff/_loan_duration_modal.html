<div class="modal modal-open">
  <div class="modal-box max-w-md">

    <div class="flex justify-between items-start mb-5">
      <div>
        <h3 class="font-bold text-xl">Loan Duration</h3>
        <p class="text-sm text-base-content/50 mt-1">The due date a checkout gets when staff don't pick one themselves.</p>
      </div>
    </div>

    {% if error %}
    <div class="alert alert-error text-sm mb-4 py-2">{{ error }}</div>
    {% endif %}

    <form id="loan-duration-form"
          hx-post="/api/v1/loan-duration/update"
          hx-target="#modal-container"
          hx-swap="innerHTML"
          class="space-y-4">

      <div>
        <label class="text-xs font-semibold text-base-content/50 tracking-wide">DEFAULT DUE DATE (DAYS FROM CHECKOUT)</label>
        <input type="number" name="default_loan_days" min="1" max="90" required
               value="{{ default_loan_days }}"
               class="input input-bordered input-sm w-full mt-1">
        <p class="text-xs text-base-content/40 mt-1">
          Used only when a checkout's due date is left blank -- the checkout form's own date picker always wins if staff pick one.
        </p>
      </div>

      <div class="modal-action flex justify-end items-center gap-2 mt-6">
        <button type="button" class="btn btn-outline" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Settings</button>
      </div>
    </form>
  </div>
</div>
