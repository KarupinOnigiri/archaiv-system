{# Shared "no match" modal for the barcode-scan Enter-key shortcut on
   Inventory/Members/Staff (see each page's own <script>, and
   routes/assets.py:asset_by_barcode, routes/members.py:member_by_barcode,
   routes/staff.py:staff_by_barcode). One generic template rather than
   three near-identical ones - only `kind` (a plain-English noun for
   what was being searched) and `barcode` (the scanned/typed value)
   differ per caller. #}
<dialog id="barcode-not-found-modal" class="modal" open>
  <div class="modal-box max-w-sm text-center relative">
    <!-- Absolutely positioned (rather than a flex header row) - this
         modal's whole layout is centered/stacked (icon, title, body all
         mx-auto), so the ESC pill sits in the corner instead of trying to
         share a row with a centered title. -->
    <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all absolute top-3 right-3"
            onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    <div class="mx-auto w-12 h-12 rounded-full bg-error/10 flex items-center justify-center mb-3">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/><line x1="8" y1="8" x2="14" y2="14"/></svg>
    </div>
    <h3 class="font-bold text-lg">No match found</h3>
    <p class="text-sm text-base-content/60 mt-1">No {{ kind }} matches barcode <span class="font-mono font-medium text-base-content">{{ barcode }}</span>.</p>
    <div class="modal-action justify-center mt-4">
      <button type="button" class="btn btn-sm" onclick="this.closest('.modal').remove()">Close</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>
