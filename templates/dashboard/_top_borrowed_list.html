{% for item in dash_top_borrowed %}
<a href="/assets?q={{ item.asset_code }}" class="flex items-center gap-2 group">
  <span class="text-xs text-base-content/40 w-4 shrink-0">{{ loop.index }}</span>
  <span class="text-sm truncate flex-1 group-hover:text-primary transition-colors">{{ item.asset_name }}</span>
  <span class="text-xs font-semibold text-base-content/60 shrink-0">&times;{{ item.borrow_count }}</span>
</a>
{% else %}
<div class="h-full flex items-center justify-center text-sm text-base-content/50">
  No borrows {{ range_label }}.
</div>
{% endfor %}
