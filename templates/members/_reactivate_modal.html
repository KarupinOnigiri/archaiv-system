<div class="modal modal-open">
  <div class="modal-box max-w-sm max-h-[85vh] overflow-y-auto">
    <h3 class="font-bold text-lg mb-2">Reactivate Member</h3>
    <p class="text-sm text-base-content/70 mb-4">
      Reactivate <strong>{{ full_name(member.first_name, member.last_name, member.middle_name, member.suffix) }}</strong>?
      They'll be able to borrow tools again.
    </p>

    {% if error %}
    <p class="text-error text-sm mb-3">{{ error }}</p>
    {% endif %}

    <form hx-post="/api/v1/members/{{ member.id }}/reactivate" hx-target="closest .modal" hx-swap="outerHTML">
      <div class="modal-action">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-success">Reactivate</button>
      </div>
    </form>
  </div>
</div>
