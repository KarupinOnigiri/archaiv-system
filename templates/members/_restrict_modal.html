<div class="modal modal-open">
  <div class="modal-box max-w-sm max-h-[85vh] overflow-y-auto">
    <h3 class="font-bold text-lg mb-2">Restrict Member</h3>
    <p class="text-sm text-base-content/70 mb-4">
      Flag <strong>{{ full_name(member.first_name, member.last_name, member.middle_name, member.suffix) }}</strong> as restricted.
      They won't be able to borrow tools until this is lifted.
    </p>

    {% if error %}
    <p class="text-error text-sm mb-3">{{ error }}</p>
    {% endif %}

    <form hx-post="/api/v1/members/{{ member.id }}/restrict" hx-target="closest .modal" hx-swap="outerHTML"
      hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'>
      <div class="form-control mb-2">
        <label class="label">
          <span class="label-text">Reason <span class="text-error">*</span></span>
        </label>
        <textarea name="restriction_reason" rows="3" required
                  placeholder="e.g. Overdue tool return, damaged equipment..."
                  class="textarea textarea-bordered w-full">{{ member.restriction_reason or "" }}</textarea>
      </div>

      <div class="modal-action">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-warning">Restrict</button>
      </div>
    </form>
  </div>
</div>
