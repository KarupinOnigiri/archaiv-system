<dialog id="restrict-member-modal" class="modal" open>
  <div class="modal-box max-w-md">
    <h3 class="text-lg font-bold">Restrict {{ full_name(member.first_name, member.last_name, member.middle_name, member.suffix) }}</h3>
    <p class="text-sm text-base-content/50 mt-1 mb-5">They won't be able to borrow tools until this is lifted. A reason is required for the audit log.</p>

    <form id="restrict-member-form" class="space-y-2">
      <label class="label py-1"><span class="label-text text-xs font-medium">Reason *</span></label>
      <textarea name="restriction_reason" required rows="3" class="textarea textarea-bordered w-full" placeholder="e.g. Overdue item not returned, damaged asset, policy violation..."></textarea>
    </form>

    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('restrict-member-modal').close(); document.getElementById('restrict-member-modal').remove();">Cancel</button>
      <button type="button" id="restrict-member-submit" class="btn btn-warning btn-sm rounded-full">Restrict Member</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
(function () {
  const modal = document.getElementById('restrict-member-modal');
  const form = document.getElementById('restrict-member-form');
  const submitBtn = document.getElementById('restrict-member-submit');

  submitBtn.addEventListener('click', async function () {
    if (!form.reportValidity()) return;

    const data = Object.fromEntries(new FormData(form).entries());
    submitBtn.disabled = true;
    submitBtn.textContent = 'Restricting...';

    try {
      const res = await fetch('/api/v1/members/{{ member.id }}/restrict', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
        },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (!res.ok) {
        showToast(result.error || "Couldn't restrict member", 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Restrict Member';
        return;
      }

      modal.close();
      modal.remove();
      sessionStorage.setItem('pending-toast', JSON.stringify({ message: 'Member restricted', type: 'info' }));
      window.location.reload();
    } catch (err) {
      showToast("Couldn't restrict member", 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Restrict Member';
    }
  });
})();
</script>
