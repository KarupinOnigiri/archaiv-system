<div class="modal modal-open">
  <div class="modal-box max-w-2xl flex flex-col max-h-[85vh]">

    <div class="flex justify-between items-start mb-5 shrink-0">
      <div>
        <h3 class="font-bold text-xl">Restriction History</h3>
        <p class="text-sm text-base-content/50 mt-1">{{ full_name(member.first_name, member.last_name, member.middle_name, member.suffix) }}</p>
      </div>
      <!-- ESC pill, not an X icon - see assets/_details_modal.html's
           close button for the full reasoning. -->
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">
        ESC
      </button>
    </div>

    <div id="restriction-history-spinner" class="htmx-indicator flex justify-center py-2 shrink-0">
      <span class="loading loading-spinner loading-sm text-primary"></span>
    </div>

    <div class="flex-1 overflow-y-auto min-h-0 pr-1">
      <div id="restriction-history-table-container"
           hx-get="/api/v1/members/{{ member.id }}/restriction-history-modal/table"
           hx-trigger="load"
           hx-target="#restriction-history-table-container"
           hx-swap="innerHTML"
           hx-indicator="#restriction-history-spinner"
           hx-vals='{"limit": 10, "offset": 0}'>
        <div class="flex justify-center py-8">
          <span class="loading loading-spinner loading-sm text-primary"></span>
        </div>
      </div>
    </div>

    <!-- Just removes itself - appended with hx-swap="beforeend" (see
         "View Full History" in _profile_modal.html), so the profile panel
         is still sitting there underneath once this closes. -->
    <div class="modal-action mt-6 shrink-0">
      <button type="button" class="btn btn-primary" onclick="this.closest('.modal').remove()">
        Close
      </button>
    </div>
  </div>
</div>
