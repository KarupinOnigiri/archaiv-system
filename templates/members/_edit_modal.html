<div class="modal modal-open">
  <!-- Same max-w-4xl flex flex-col max-h-[85vh] treatment as
       members/_add_modal.html, so Add and Edit present at the same size
       instead of Edit feeling cramped by comparison. -->
  <div class="modal-box max-w-4xl flex flex-col max-h-[85vh]">

    <div class="flex justify-between items-start mb-5 shrink-0">
      <div>
        <h3 class="font-bold text-xl">Edit Member</h3>
        <p class="text-sm text-base-content/50 mt-1">{{ member.member_code }} &middot; Update this member's details.</p>
      </div>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>

    <div class="flex-1 overflow-y-auto min-h-0 pr-1 -mr-1">

    <!-- Always rendered (not just when there is an error), invisible (not
         removed) when empty - reserves the alert box's layout space so
         content below never jumps when an error appears. -->
    <div class="alert alert-error text-sm mb-4 py-2 {% if not error %}invisible{% endif %}">{{ error or '' }}</div>

    <form id="edit-member-form" hx-post="/api/v1/members/{{ member.id }}/edit" hx-target="closest .modal" hx-swap="outerHTML">
      <div class="bg-base-200/50 rounded-xl p-5 space-y-4">

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">FIRST NAME <span class="text-error">*</span></label>
            <input type="text" name="first_name" required value="{{ member.first_name }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">LAST NAME <span class="text-error">*</span></label>
            <input type="text" name="last_name" required value="{{ member.last_name }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">MIDDLE NAME</label>
            <input type="text" name="middle_name" value="{{ member.middle_name or '' }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">SUFFIX</label>
            <input type="text" name="suffix" list="suffix-options-edit" value="{{ member.suffix or '' }}"
                   placeholder="e.g. Jr., III" autocomplete="off"
                   class="input input-bordered w-full mt-1 bg-base-100"
                   oninput="if (this.value === 'N/A') this.value = '';">
            <datalist id="suffix-options-edit">
              <option value="N/A">
              <option value="Jr.">
              <option value="Sr.">
              <option value="II">
              <option value="III">
              <option value="IV">
              <option value="V">
            </datalist>
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">DEPARTMENT</label>
            <select name="department_id" class="select select-bordered w-full mt-1 bg-base-100">
              {% for dept in departments %}
              <option value="{{ dept.id }}" {% if member.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">BATCH</label>
            <input type="text" name="batch" value="{{ member.batch or '' }}" placeholder="e.g. Batch 2026-A"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">PHONE NUMBER</label>
            <input type="tel" name="phone_number" value="{{ member.phone_number or '' }}" placeholder="e.g. 0917 123 4567"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">BARCODE ID</label>
            <input type="text" name="barcode_id" value="{{ member.barcode_id }}" placeholder="Scan existing ID"
                   autocomplete="off"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">MEMBER TYPE</label>
            <div class="input input-bordered w-full mt-1 bg-base-200 text-base-content/50 flex items-center text-sm capitalize">
              {{ member.member_type }}
            </div>
          </div>
        </div>

        <div class="bg-info/10 rounded-lg p-3 flex gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-info shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <p class="text-xs text-info/80">Barcode ID and member type can't be changed here.</p>
        </div>

      </div>

      <div class="modal-action flex justify-end gap-2 mt-6 sticky bottom-0 bg-base-100 pb-1">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
    </div>
  </div>
</div>
