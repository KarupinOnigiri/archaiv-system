<div class="modal modal-open">
  <div class="modal-box max-w-2xl">

    <div class="flex justify-between items-start mb-5">
      <div>
        <h3 class="font-bold text-xl">Edit Member</h3>
        <p class="text-sm text-base-content/50 mt-1">{{ member.member_code }} &middot; Update this member's details.</p>
      </div>
      <button type="button" onclick="this.closest('.modal').remove()"
              class="text-base-content/40 hover:text-base-content">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </button>
    </div>

    {% if error %}
    <div class="alert alert-error text-sm mb-4 py-2">{{ error }}</div>
    {% endif %}

    <form id="edit-member-form" hx-post="/api/v1/members/{{ member.id }}/edit" hx-target="closest .modal" hx-swap="outerHTML">
      <div class="bg-base-200/50 rounded-xl p-5 space-y-4">

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">FIRST NAME <span class="text-error">*</span></label>
            <input type="text" name="first_name" required value="{{ member.first_name }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">LAST NAME <span class="text-error">*</span></label>
            <input type="text" name="last_name" required value="{{ member.last_name }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">MIDDLE NAME</label>
            <input type="text" name="middle_name" value="{{ member.middle_name or '' }}"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">SUFFIX</label>
            <input type="text" name="suffix" list="suffix-options-edit" value="{{ member.suffix or '' }}"
                   placeholder="e.g. Jr., III" autocomplete="off"
                   class="input input-bordered w-full mt-1 bg-base-100"
                   oninput="if (this.value === 'N/A') this.value = '';">
            <datalist id="suffix-options-edit">
              <option value="N/A">
              <option value="Jr.">
              <option value="Sr.">
              <option value="II">
              <option value="III">
              <option value="IV">
              <option value="V">
            </datalist>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">DEPARTMENT</label>
            <select name="department_id" class="select select-bordered w-full mt-1 bg-base-100">
              {% for dept in departments %}
              <option value="{{ dept.id }}" {% if member.department_id == dept.id %}selected{% endif %}>{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">BATCH</label>
            <input type="text" name="batch" value="{{ member.batch or '' }}" placeholder="e.g. Batch 2026-A"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4 pt-2 border-t border-base-300">
          <div>
            <p class="text-xs font-semibold text-base-content/50 tracking-wide">BARCODE ID</p>
            <p class="text-sm mt-1 bg-base-100 border border-base-300 rounded-lg px-3 py-2.5">{{ member.barcode_id }}</p>
          </div>
          <div>
            <p class="text-xs font-semibold text-base-content/50 tracking-wide">MEMBER TYPE</p>
            <p class="text-sm mt-1 bg-base-100 border border-base-300 rounded-lg px-3 py-2.5 capitalize">{{ member.member_type }}</p>
          </div>
        </div>
        <p class="text-xs text-base-content/40 -mt-2">Barcode ID and member type can't be changed here.</p>

      </div>

      <div class="modal-action flex justify-end gap-2 mt-6">
        <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </div>
    </form>
  </div>
</div>
