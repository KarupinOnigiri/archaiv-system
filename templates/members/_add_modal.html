<div class="modal modal-open">
  <!-- Wide (max-w-4xl, vs. the previous max-w-2xl) and fields regrouped
       into 3-column rows (was 2) specifically so every field fits
       without this modal needing its own scroll area -- no max-h/
       overflow-y-auto on modal-box anymore; its own built-in overflow
       handling (daisyUI) is the only safety net left, for a viewport
       short enough that even this shorter layout still can't fit --
       not something styled/managed here, just the honest fallback. -->
  <div class="modal-box max-w-4xl">

    <div class="flex justify-between items-start mb-5">
      <div>
        <h3 class="font-bold text-xl">Add New Member</h3>
        <p class="text-sm text-base-content/50 mt-1">Register a new trainee or trainer who can borrow tools.</p>
      </div>
    </div>

    {% if error %}
    <div class="alert alert-error text-sm mb-4 py-2">{{ error }}</div>
    {% endif %}

    <form id="add-member-form" hx-post="/api/v1/members/add" hx-target="#modal-container" hx-swap="innerHTML">
      <div class="bg-base-200/50 rounded-xl p-5 space-y-4">

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">FIRST NAME <span class="text-error">*</span></label>
            <input type="text" name="first_name" required placeholder="e.g. Juan"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">LAST NAME <span class="text-error">*</span></label>
            <input type="text" name="last_name" required placeholder="e.g. Dela Cruz"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">MIDDLE NAME</label>
            <input type="text" name="middle_name" placeholder="Optional"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">SUFFIX</label>
            <input type="text" name="suffix" list="suffix-options-add" placeholder="e.g. Jr., III" autocomplete="off"
                   class="input input-bordered w-full mt-1 bg-base-100"
                   oninput="if (this.value === 'N/A') this.value = '';">
            <datalist id="suffix-options-add">
              <option value="N/A">
              <option value="Jr.">
              <option value="Sr.">
              <option value="II">
              <option value="III">
              <option value="IV">
              <option value="V">
            </datalist>
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">MEMBER TYPE <span class="text-error">*</span></label>
            <select name="member_type" required class="select select-bordered w-full mt-1 bg-base-100">
              <option value="" disabled selected hidden>Select Type</option>
              <option value="trainee">Trainee</option>
              <option value="trainer">Trainer</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">DEPARTMENT <span class="text-error">*</span></label>
            <select name="department_id" required class="select select-bordered w-full mt-1 bg-base-100">
              <option value="" disabled selected hidden>Select Department</option>
              {% for dept in departments %}
              <option value="{{ dept.id }}">{{ dept.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-4">
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">BATCH</label>
            <input type="text" name="batch" placeholder="e.g. Batch 2026-A"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">PHONE NUMBER</label>
            <input type="tel" name="phone_number" placeholder="e.g. 0917 123 4567"
                   class="input input-bordered w-full mt-1 bg-base-100">
          </div>
          <div>
            <label class="text-xs font-semibold text-base-content/50 tracking-wide">BARCODE ID</label>
            <!-- No longer a form field -- barcode_id is auto-generated
                 server-side to match the member's own generated ID
                 (member_code), so it's uniform and guaranteed in sync.
                 See add_member_submit in routes/members.py. -->
            <div class="input input-bordered w-full mt-1 bg-base-200 text-base-content/50 flex items-center text-sm">
              Auto-generated on save
            </div>
          </div>
        </div>

        <div class="bg-info/10 rounded-lg p-3 flex gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-info shrink-0 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          <p class="text-xs text-info/80">A member code (e.g. MBR00042) is generated automatically once this member is saved.</p>
        </div>

      </div>

      <div class="modal-action flex justify-between items-center mt-6">
        <button type="button" onclick="document.getElementById('add-member-form').reset();" class="text-sm text-base-content/50 hover:text-base-content">
          Clear form
        </button>
        <div class="flex gap-2">
          <button type="button" class="btn" onclick="document.getElementById('modal-container').innerHTML=''">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Member</button>
        </div>
      </div>
    </form>
  </div>
</div>
