<dialog id="edit-member-modal" class="modal" open>
  <div class="modal-box max-w-lg">
    <h3 class="text-lg font-bold">Edit Member</h3>
    <p class="text-sm text-base-content/50 mt-1 mb-5">{{ member.member_code }} &middot; {{ member.barcode_id }}</p>

    <form id="edit-member-form" class="space-y-4">

      <div class="grid grid-cols-2 gap-3">
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs font-medium">First Name *</span></label>
          <input type="text" name="first_name" required value="{{ member.first_name }}" class="input input-bordered w-full">
        </div>
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs font-medium">Last Name *</span></label>
          <input type="text" name="last_name" required value="{{ member.last_name }}" class="input input-bordered w-full">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs font-medium">Middle Name</span></label>
          <input type="text" name="middle_name" value="{{ member.middle_name or '' }}" class="input input-bordered w-full">
        </div>
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs font-medium">Suffix</span></label>
          <input type="text" name="suffix" value="{{ member.suffix or '' }}" class="input input-bordered w-full">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3">
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs font-medium">Department *</span></label>
          <select name="department_id" required class="select select-bordered w-full">
            {% for dept in departments %}
            <option value="{{ dept.id }}" {% if dept.id == member.department_id %}selected{% endif %}>{{ dept.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-control">
          <label class="label py-1"><span class="label-text text-xs font-medium">Batch</span></label>
          <input type="text" name="batch" value="{{ member.batch or '' }}" class="input input-bordered w-full">
        </div>
      </div>

      <!-- barcode_id and member_type are not accepted by PATCH /members/<id>/edit -->
      <p class="text-xs text-base-content/40">Barcode ID and member type can't be changed here.</p>

    </form>

    <div class="modal-action">
      <button type="button" class="btn btn-ghost btn-sm" onclick="document.getElementById('edit-member-modal').close(); document.getElementById('edit-member-modal').remove();">Cancel</button>
      <button type="button" id="edit-member-submit" class="btn btn-primary btn-sm rounded-full">Save Changes</button>
    </div>
  </div>
  <form method="dialog" class="modal-backdrop"><button>close</button></form>
</dialog>

<script>
(function () {
  const modal = document.getElementById('edit-member-modal');
  const form = document.getElementById('edit-member-form');
  const submitBtn = document.getElementById('edit-member-submit');

  submitBtn.addEventListener('click', async function () {
    if (!form.reportValidity()) return;

    const data = Object.fromEntries(new FormData(form).entries());
    submitBtn.disabled = true;
    submitBtn.textContent = 'Saving...';

    try {
      const res = await fetch('/api/v1/members/{{ member.id }}/edit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
        },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (!res.ok) {
        showToast(result.error || "Couldn't save changes", 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Save Changes';
        return;
      }

      modal.close();
      modal.remove();
      sessionStorage.setItem('pending-toast', JSON.stringify({ message: 'Member updated successfully', type: 'success' }));
      window.location.reload();
    } catch (err) {
      showToast("Couldn't save changes", 'error');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Save Changes';
    }
  });
})();
</script>
