{% extends "base.html" %}
{% block content %}
<div class="pt-6 pr-[1.875rem] pb-6 pl-6 space-y-6">

  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Activity Log</h1>
      
    </div>
  </div>

  <!-- Toolbar + table -->
  <div class="bg-base-100 rounded-xl border border-panel p-5">

    <div class="relative mb-5">
      <div id="filter-row" class="flex flex-wrap items-center gap-3">

        <button type="button" id="refresh-audit-log-btn" class="btn btn-ghost btn-sm btn-circle shrink-0" data-tooltip="Refresh list" aria-label="Refresh activity log" onclick="refreshAuditLogTable()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>

        <!-- Same plain-bordered join-item convention as transactions.html/
             monitoring.html's own Today/Yesterday presets (not daisyUI's
             .btn chrome - heavier border weight/different radius stood out
             next to the date-range boxes here) - previously this page and
             notifications.html were the odd ones out with .btn styling. -->
        <div id="audit-date-presets" class="join rounded-lg" data-tooltip="Quick date filter">
          <button type="button" id="audit-preset-today" class="date-quick-btn join-item flex items-center px-3 h-8 border border-base-300 bg-base-100 text-sm text-base-content/70 hover:bg-base-200 hover:text-base-content transition-colors"
                  onclick="setAuditDatePreset('today')">Today</button>
          <button type="button" id="audit-preset-yesterday" class="date-quick-btn join-item flex items-center px-3 h-8 border border-base-300 bg-base-100 text-sm text-base-content/70 hover:bg-base-200 hover:text-base-content transition-colors"
                  onclick="setAuditDatePreset('yesterday')">Yesterday</button>
        </div>

        <div id="audit-date-filters" class="join rounded-lg transition-shadow" data-tooltip="Date range">
          <button type="button" id="audit-date-filter-clear-btn" class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100 text-base-content/40 hover:text-base-content hover:bg-base-200 disabled:hover:bg-base-100 disabled:hover:text-base-content/40 disabled:cursor-default disabled:opacity-50 transition-colors"
                  onclick="clearAuditDateFilter()" aria-label="Clear date range filter" data-tooltip="Clear date range filter" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          </button>
          <input type="date" id="audit-since-filter" name="since"
                 aria-label="From date"
                 class="input input-bordered input-sm join-item w-32"
                 value="{{ request.args.get('since', '') }}"
                 data-tooltip="From"
                 hx-get="/api/v1/audit-log/table"
                 hx-trigger="change"
                 hx-target="#audit-log-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#table-spinner"
                 hx-include="#audit-until-filter, #audit-staff-filter"
                 hx-vals='{"limit": {{ limit }}, "offset": 0}'>
          <div class="join-item flex items-center px-1.5 h-8 border-t border-b border-base-300 bg-base-100 text-base-content/40 text-sm" aria-hidden="true">&ndash;</div>
          <input type="date" id="audit-until-filter" name="until"
                 aria-label="To date"
                 class="input input-bordered input-sm join-item w-32"
                 value="{{ request.args.get('until', '') }}"
                 data-tooltip="To"
                 hx-get="/api/v1/audit-log/table"
                 hx-trigger="change"
                 hx-target="#audit-log-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#table-spinner"
                 hx-include="#audit-since-filter, #audit-staff-filter"
                 hx-vals='{"limit": {{ limit }}, "offset": 0}'>
        </div>

        {% if staff.role == "admin" %}
        <div id="audit-staff-filter-wrap" class="join rounded-lg transition-shadow" data-tooltip="Staff">
          <button type="button" id="audit-staff-filter-clear-btn" class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100 text-base-content/40 hover:text-base-content hover:bg-base-200 disabled:hover:bg-base-100 disabled:hover:text-base-content/40 disabled:cursor-default disabled:opacity-50 transition-colors"
                  onclick="clearAuditStaffFilter()" aria-label="Clear staff filter" data-tooltip="Clear staff filter" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></svg>
          </button>
          <select id="audit-staff-filter" name="staff_id"
                  aria-label="Filter by staff"
                  class="select select-bordered select-sm join-item w-[275px]"
                  hx-get="/api/v1/audit-log/table"
                  hx-trigger="change"
                  hx-target="#audit-log-table-container"
                  hx-swap="innerHTML"
                  hx-indicator="#table-spinner"
                  hx-include="#audit-since-filter, #audit-until-filter"
                  hx-vals='{"limit": {{ limit }}, "offset": 0}'>
            <option value="">All staff</option>
            {% for s in staff_options %}
            <option value="{{ s.id }}" {% if request.args.get('staff_id') == s.id | string %}selected{% endif %}>{{ full_name(s.first_name, s.last_name, s.middle_name, s.suffix) }} (@{{ s.username }})</option>
            {% endfor %}
          </select>
        </div>
        {% endif %}

        <button type="button" id="audit-clear-filters-btn" class="btn btn-ghost btn-xs btn-circle text-error hover:bg-error/10 hidden relative"
                onclick="clearAllAuditFilters()" data-tooltip="Clear filters (Esc)" aria-label="Clear filters">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          <span id="audit-clear-filters-count" class="absolute -top-1 -right-1 bg-error text-error-content text-[10px] font-semibold rounded-full w-4 h-4 flex items-center justify-center leading-none">0</span>
        </button>

        <span id="table-spinner" class="htmx-indicator loading loading-spinner loading-sm text-primary"></span>
      </div>
    </div>

    <div id="audit-log-table-container"
         hx-get="/api/v1/audit-log/table"
         hx-trigger="load"
         hx-target="#audit-log-table-container"
         hx-swap="innerHTML"
         hx-include="#audit-since-filter, #audit-until-filter, #audit-staff-filter"
         hx-vals='{"limit": {{ limit }}, "offset": {{ offset }} }'>
    </div>
  </div>
</div>

<!-- Shared with the Staff "Full Activity" modal, which renders these same
     table rows too - see audit_log/_detail_modal.html's own comment. -->
{% include "audit_log/_detail_modal.html" %}

<style>
.htmx-indicator { opacity: 0; }
.htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
</style>

<script>
function formatDateLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Prefer htmx's own trigger API over a raw dispatchEvent - more reliable
// across htmx versions than relying on native event bubbling.
function fireHtmxChange(el) {
  if (window.htmx) {
    htmx.trigger(el, 'change');
  } else {
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
}

function setAuditDatePreset(which) {
  const since = document.getElementById('audit-since-filter');
  const until = document.getElementById('audit-until-filter');
  const target = new Date();
  if (which === 'yesterday') target.setDate(target.getDate() - 1);
  const dateStr = formatDateLocal(target);
  since.value = dateStr;
  until.value = dateStr;
  fireHtmxChange(since);
}

function clearAuditDateFilter() {
  const since = document.getElementById('audit-since-filter');
  const until = document.getElementById('audit-until-filter');
  if (since.value === '' && until.value === '') return;
  since.value = '';
  until.value = '';
  fireHtmxChange(since);
}

// No-op when the staff filter isn't in the DOM (non-admins never get the
// dropdown), so callers can invoke this unconditionally.
function clearAuditStaffFilter() {
  const staffFilter = document.getElementById('audit-staff-filter');
  if (!staffFilter || staffFilter.value === '') return;
  staffFilter.value = '';
  fireHtmxChange(staffFilter);
}

// Re-fetches the table with whatever filters/page are currently in effect --
// unlike changing a filter, a manual refresh shouldn't jump back to page 1.
function refreshAuditLogTable() {
  const table = document.querySelector('#audit-log-table-container table');
  const since = document.getElementById('audit-since-filter').value;
  const until = document.getElementById('audit-until-filter').value;
  const staffFilter = document.getElementById('audit-staff-filter');
  const params = new URLSearchParams();
  if (since) params.set('since', since);
  if (until) params.set('until', until);
  if (staffFilter && staffFilter.value) params.set('staff_id', staffFilter.value);
  params.set('limit', (table && table.dataset.limit) || '{{ limit }}');
  params.set('offset', (table && table.dataset.offset) || '{{ offset }}');
  htmx.ajax('GET', '/api/v1/audit-log/table', {
    target: '#audit-log-table-container',
    swap: 'innerHTML',
    values: Object.fromEntries(params)
  });
}

function clearAllAuditFilters() {
  const since = document.getElementById('audit-since-filter');
  const until = document.getElementById('audit-until-filter');
  const staffFilter = document.getElementById('audit-staff-filter');
  const dateActive = since.value !== '' || until.value !== '';
  const staffActive = !!(staffFilter && staffFilter.value !== '');
  if (!dateActive && !staffActive) return;
  since.value = '';
  until.value = '';
  if (staffFilter) staffFilter.value = '';
  fireHtmxChange(since);
}

function updateAuditFilterUI() {
  const since = document.getElementById('audit-since-filter');
  const until = document.getElementById('audit-until-filter');
  const staffFilter = document.getElementById('audit-staff-filter');
  const dateActive = since.value !== '' || until.value !== '';
  const staffActive = !!(staffFilter && staffFilter.value !== '');

  document.getElementById('audit-date-filters').classList.toggle('ring-2', dateActive);
  document.getElementById('audit-date-filters').classList.toggle('ring-primary/40', dateActive);
  document.getElementById('audit-date-filter-clear-btn').disabled = !dateActive;

  const staffFilterWrap = document.getElementById('audit-staff-filter-wrap');
  if (staffFilterWrap) {
    staffFilterWrap.classList.toggle('ring-2', staffActive);
    staffFilterWrap.classList.toggle('ring-primary/40', staffActive);
    document.getElementById('audit-staff-filter-clear-btn').disabled = !staffActive;
  }

  const activeCount = (dateActive ? 1 : 0) + (staffActive ? 1 : 0);
  const clearBtn = document.getElementById('audit-clear-filters-btn');
  clearBtn.classList.toggle('hidden', activeCount === 0);
  document.getElementById('audit-clear-filters-count').textContent = activeCount;
  const clearLabel = activeCount > 0 ? `Clear ${activeCount} filter${activeCount > 1 ? 's' : ''}` : 'Clear filters';
  clearBtn.setAttribute('title', clearLabel);
  clearBtn.setAttribute('aria-label', clearLabel);

  const today = formatDateLocal(new Date());
  const yesterday = formatDateLocal(new Date(Date.now() - 86400000));
  const isToday = since.value === today && until.value === today;
  const isYesterday = since.value === yesterday && until.value === yesterday;
  // Plain-bordered active/inactive swap, matching transactions.html's own
  // date-quick-btn convention now that this page uses the same markup.
  const todayBtn = document.getElementById('audit-preset-today');
  const yesterdayBtn = document.getElementById('audit-preset-yesterday');
  todayBtn.classList.toggle('border-primary', isToday);
  todayBtn.classList.toggle('bg-primary/10', isToday);
  todayBtn.classList.toggle('text-primary', isToday);
  yesterdayBtn.classList.toggle('border-primary', isYesterday);
  yesterdayBtn.classList.toggle('bg-primary/10', isYesterday);
  yesterdayBtn.classList.toggle('text-primary', isYesterday);
}

window.pageConfigRequestHandler = function (evt) {
  const container = document.getElementById('audit-log-table-container');
  if (evt.detail.target !== container) return;
  try {
    const params = evt.detail.parameters || {};
    const url = new URL(window.location.href);
    ['since', 'until', 'staff_id', 'limit', 'offset'].forEach(function (key) {
      if (params[key] !== undefined && params[key] !== '') {
        url.searchParams.set(key, params[key]);
      } else {
        url.searchParams.delete(key);
      }
    });
    window.history.replaceState({}, '', url);
  } catch (e) {}
};

window.pageAfterSwapHandler = function (evt) {
  if (evt.target && evt.target.id === 'audit-log-table-container') {
    updateAuditFilterUI();
  }
};

// --- Keyboard shortcuts (Activity Log page) ---
// Same isTypingTarget/isModalOpen guard as every other tab - shortcuts
// back off while typing or while a modal is open.
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

function isModalOpen() {
  const container = document.getElementById('modal-container');
  const detailModal = document.getElementById('audit-log-detail-modal');
  return !!(container && container.querySelector(':scope > .modal')) || !!(detailModal && detailModal.open);
}

window.pageKeydownHandler = function (e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  // ArrowLeft / ArrowRight - previous / next page.
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    if (isTypingTarget(e.target) || isModalOpen()) return;
    const container = document.getElementById('audit-log-table-container');
    if (!container) return;
    const label = e.key === 'ArrowRight' ? 'Next page' : 'Previous page';
    const btn = container.querySelector('button[aria-label="' + label + '"]');
    if (btn && !btn.disabled) {
      e.preventDefault();
      btn.click();
    }
    return;
  }

  // Escape - with no modal open, reset every filter, same as clicking
  // "Clear filters". A modal open lets base.html's handler close it instead.
  if (e.key === 'Escape') {
    if (isModalOpen()) return;
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
    clearAllAuditFilters();
  }
};

setTimeout(updateAuditFilterUI, 0);
</script>
{% endblock %}
