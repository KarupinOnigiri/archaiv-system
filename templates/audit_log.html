{% extends "base.html" %}
{% block content %}
<div class="pt-6 pr-[1.875rem] pb-6 pl-6 space-y-6">

  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Activity Log</h1>
      <p class="text-sm text-base-content/50 mt-1">
        {% if staff.role == "admin" %}
          A record of every action taken across the system.
        {% else %}
          A record of actions you've taken. Only admins can view everyone's activity.
        {% endif %}
      </p>
    </div>
  </div>

  <!-- Toolbar + table -->
  <div class="bg-base-100 rounded-xl border border-base-300 p-5">

    <div class="relative mb-5">
      <div id="filter-row" class="flex flex-wrap items-center gap-3">

        <div id="audit-date-filters" class="join rounded-lg transition-shadow" title="Date range">
          <button type="button" id="audit-date-filter-clear-btn" class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100 text-base-content/40 hover:text-base-content hover:bg-base-200 disabled:hover:bg-base-100 disabled:hover:text-base-content/40 disabled:cursor-default disabled:opacity-50 transition-colors"
                  onclick="clearAuditDateFilter()" aria-label="Clear date range filter" title="Clear date range filter" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          </button>
          <input type="date" id="audit-since-filter" name="since"
                 aria-label="From date"
                 class="input input-bordered input-sm join-item w-32"
                 value="{{ request.args.get('since', '') }}"
                 title="From"
                 hx-get="/api/v1/audit-log/table"
                 hx-trigger="change"
                 hx-target="#audit-log-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#table-spinner"
                 hx-include="#audit-until-filter"
                 hx-vals='{"limit": {{ limit }}, "offset": 0}'>
          <div class="join-item flex items-center px-1.5 h-8 border-t border-b border-base-300 bg-base-100 text-base-content/40 text-sm" aria-hidden="true">&ndash;</div>
          <input type="date" id="audit-until-filter" name="until"
                 aria-label="To date"
                 class="input input-bordered input-sm join-item w-32"
                 value="{{ request.args.get('until', '') }}"
                 title="To"
                 hx-get="/api/v1/audit-log/table"
                 hx-trigger="change"
                 hx-target="#audit-log-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#table-spinner"
                 hx-include="#audit-since-filter"
                 hx-vals='{"limit": {{ limit }}, "offset": 0}'>
        </div>

        <span id="table-spinner" class="htmx-indicator loading loading-spinner loading-sm text-primary"></span>
      </div>
    </div>

    <div id="audit-log-table-container"
         hx-get="/api/v1/audit-log/table"
         hx-trigger="load"
         hx-target="#audit-log-table-container"
         hx-swap="innerHTML"
         hx-include="#audit-since-filter, #audit-until-filter"
         hx-vals='{"limit": {{ limit }}, "offset": {{ offset }} }'>
    </div>
  </div>
</div>

<style>
.htmx-indicator { opacity: 0; }
.htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
</style>

<script>
function clearAuditDateFilter() {
  const since = document.getElementById('audit-since-filter');
  const until = document.getElementById('audit-until-filter');
  if (since.value === '' && until.value === '') return;
  since.value = '';
  until.value = '';
  since.dispatchEvent(new Event('change', { bubbles: true }));
}

function updateAuditFilterUI() {
  const since = document.getElementById('audit-since-filter');
  const until = document.getElementById('audit-until-filter');
  const dateActive = since.value !== '' || until.value !== '';
  document.getElementById('audit-date-filters').classList.toggle('ring-2', dateActive);
  document.getElementById('audit-date-filters').classList.toggle('ring-primary/40', dateActive);
  document.getElementById('audit-date-filter-clear-btn').disabled = !dateActive;
}

document.addEventListener('htmx:configRequest', function (evt) {
  const container = document.getElementById('audit-log-table-container');
  if (evt.detail.target !== container) return;
  try {
    const params = evt.detail.parameters || {};
    const url = new URL(window.location.href);
    ['since', 'until', 'limit', 'offset'].forEach(function (key) {
      if (params[key] !== undefined && params[key] !== '') {
        url.searchParams.set(key, params[key]);
      } else {
        url.searchParams.delete(key);
      }
    });
    window.history.replaceState({}, '', url);
  } catch (e) {}
});

document.addEventListener('htmx:afterSwap', function (evt) {
  if (evt.target && evt.target.id === 'audit-log-table-container') {
    updateAuditFilterUI();
  }
});

document.addEventListener('DOMContentLoaded', updateAuditFilterUI);
</script>
{% endblock %}
