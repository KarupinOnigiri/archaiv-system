{% extends "base.html" %}
{% block content %}
<div class="p-6 lg:p-8 space-y-6">

  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Members</h1>
      <p class="text-sm text-base-content/50 mt-1">Everyone who can borrow tools &mdash; trainees, trainers, and their current standing.</p>
    </div>
    <div class="flex items-center gap-2">
      {% if staff.role in ["admin", "in_charge"] %}
      <button type="button" class="btn btn-outline btn-sm"
              hx-get="/api/v1/departments/manage-form"
              hx-target="#modal-container"
              hx-swap="innerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Manage Departments
      </button>
      <button type="button" class="btn btn-primary btn-sm rounded-full"
              hx-get="/api/v1/members/add-form"
              hx-target="#modal-container"
              hx-swap="innerHTML">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
        Add New Member
      </button>
      {% endif %}
    </div>
  </div>

  <!-- Stat cards -->
  <!-- Clicking a card jumps the table to the matching standing filter, mirroring
       Inventory's stat-card click behavior. -->
  <div id="member-stat-cards-container"
       class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"
       hx-get="/api/v1/members/stat-cards"
       hx-trigger="members-refreshed from:body"
       hx-target="this"
       hx-swap="innerHTML">
    {% include "members/_stat_cards.html" %}
  </div>

  <!-- Toolbar + table -->
  <div class="bg-base-100 rounded-xl border border-base-300 p-5">

    <div id="filter-row" class="flex flex-wrap items-center gap-3 mb-5">

      <div id="search-filter-wrap" class="join w-64 shrink-0 rounded-lg transition-shadow" title="Search">
        <div class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-base-content/40 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </div>
        <input type="search" id="member-search" name="q" placeholder="Search by name, barcode, or code..."
               aria-label="Search members by name, barcode, or code"
               class="input input-bordered input-sm join-item w-full [&::-webkit-search-cancel-button]:appearance-none [&::-webkit-search-cancel-button]:hidden"
               hx-get="/api/v1/members"
               hx-trigger="keyup changed delay:400ms, search"
               hx-target="#member-table-container"
               hx-swap="innerHTML"
               hx-indicator="#table-spinner"
               hx-include="#department-filter, #restricted-filter, #show-inactive-toggle"
               hx-vals='{"limit": 20, "offset": 0}'>
        <button type="button" id="member-search-clear-btn" class="join-item hidden flex items-center px-2 h-8 border border-base-300 bg-base-100 text-base-content/40 hover:text-base-content"
                aria-label="Clear search" title="Clear search" onclick="clearMemberSearch()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="department-filter-wrap" class="join rounded-lg transition-shadow" title="Department"
           hx-get="/api/v1/departments/options"
           hx-trigger="departments-changed from:body"
           hx-target="#department-filter"
           hx-swap="innerHTML">
        <div class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-base-content/40 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
        </div>
        <select id="department-filter" name="department_id"
                aria-label="Filter by department"
                class="select select-bordered select-sm join-item w-40"
                hx-get="/api/v1/members"
                hx-trigger="change"
                hx-target="#member-table-container"
                hx-swap="innerHTML"
                hx-indicator="#table-spinner"
                hx-include="#member-search, #restricted-filter, #show-inactive-toggle"
                hx-vals='{"limit": 20, "offset": 0}'>
          <option value="">Department</option>
          {% for dept in departments %}
          <option value="{{ dept.id }}">{{ dept.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div id="restricted-filter-wrap" class="join rounded-lg transition-shadow" title="Standing">
        <div class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-base-content/40 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
        </div>
        <select id="restricted-filter" name="is_restricted"
                aria-label="Filter by standing"
                class="select select-bordered select-sm join-item w-36"
                hx-get="/api/v1/members"
                hx-trigger="change"
                hx-target="#member-table-container"
                hx-swap="innerHTML"
                hx-indicator="#table-spinner"
                hx-include="#member-search, #department-filter, #show-inactive-toggle"
                hx-vals='{"limit": 20, "offset": 0}'>
          <option value="">Standing</option>
          <option value="1">Restricted only</option>
          <option value="0">Not restricted</option>
        </select>
      </div>

      <button type="button" id="clear-member-filters-btn" class="btn btn-ghost btn-xs btn-circle text-error hover:bg-error/10 hidden relative" onclick="clearAllMemberFilters()" title="Clear filters" aria-label="Clear filters">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
        <span id="clear-member-filters-count" class="absolute -top-1 -right-1 bg-error text-error-content text-[10px] font-semibold rounded-full w-4 h-4 flex items-center justify-center leading-none">0</span>
      </button>

      <label id="inactive-toggle-label" class="flex items-center gap-2 text-sm cursor-pointer select-none ml-auto px-2.5 py-1 rounded-full transition-colors {% if show_inactive %}text-warning font-semibold bg-warning/10{% else %}text-base-content/70{% endif %}">
        <input type="checkbox" id="show-inactive-toggle" name="show_inactive"
               value="1"
               class="toggle toggle-sm {% if show_inactive %}toggle-warning{% endif %}"
               {% if show_inactive %}checked{% endif %}
               hx-get="/api/v1/members"
               hx-trigger="change"
               hx-target="#member-table-container"
               hx-swap="innerHTML"
               hx-indicator="#table-spinner"
               hx-include="#member-search, #department-filter, #restricted-filter"
               hx-vals='{"limit": 20, "offset": 0}'>
        <span id="inactive-toggle-text">{% if show_inactive %}Viewing inactive{% else %}Show inactive{% endif %}</span>
      </label>

    </div>

    <div class="relative">
      <div id="table-spinner" class="htmx-indicator absolute inset-0 z-10 flex items-center justify-center bg-base-100/60 rounded-lg">
        <span class="loading loading-spinner loading-md text-primary"></span>
      </div>
      <div id="member-table-container"
           hx-get="/api/v1/members"
           hx-trigger="members-refreshed from:body"
           hx-target="#member-table-container"
           hx-swap="innerHTML"
           hx-indicator="#table-spinner"
           hx-include="#member-search, #department-filter, #restricted-filter, #show-inactive-toggle"
           hx-vals='{"limit": {{ limit }}, "offset": 0, "sort_by": "{{ sort_by }}", "sort_dir": "{{ sort_dir }}"}'>
        {% include "members/_table.html" %}
      </div>
    </div>

  </div>
</div>

<div id="modal-container"></div>

<script>
// Mirrors Inventory's show-archived-toggle handler: live-updates the pill
// label's color/text the instant the toggle is flipped, rather than waiting
// on a full page reload to pick up the server-rendered show_inactive state.
document.getElementById('show-inactive-toggle').addEventListener('change', function (e) {
  currentStandingFilter = null;
  const isInactive = e.target.checked;

  e.target.classList.toggle('toggle-warning', isInactive);

  const toggleLabel = document.getElementById('inactive-toggle-label');
  toggleLabel.classList.toggle('text-warning', isInactive);
  toggleLabel.classList.toggle('font-semibold', isInactive);
  toggleLabel.classList.toggle('bg-warning/10', isInactive);
  toggleLabel.classList.toggle('text-base-content/70', !isInactive);

  document.getElementById('inactive-toggle-text').textContent = isInactive ? 'Viewing inactive' : 'Show inactive';

  updateMemberFilterUI();
});
</script>

<script>
// Same active-filter highlighting + "Clear filters" + search clear (x)
// pattern used on the Inventory tab, scoped to this page's three controls.
function updateMemberFilterUI() {
  const search = document.getElementById('member-search');
  const department = document.getElementById('department-filter');
  const restricted = document.getElementById('restricted-filter');

  const searchActive = search.value.trim().length > 0;
  const departmentActive = department.value !== '';
  const restrictedActive = restricted.value !== '';

  document.getElementById('search-filter-wrap').classList.toggle('ring-2', searchActive);
  document.getElementById('search-filter-wrap').classList.toggle('ring-primary/40', searchActive);
  document.getElementById('member-search-clear-btn').classList.toggle('hidden', !searchActive);

  document.getElementById('department-filter-wrap').classList.toggle('ring-2', departmentActive);
  document.getElementById('department-filter-wrap').classList.toggle('ring-primary/40', departmentActive);

  document.getElementById('restricted-filter-wrap').classList.toggle('ring-2', restrictedActive);
  document.getElementById('restricted-filter-wrap').classList.toggle('ring-primary/40', restrictedActive);

  const anyActive = searchActive || departmentActive || restrictedActive;
  const activeCount = [searchActive, departmentActive, restrictedActive].filter(Boolean).length;
  const clearBtn = document.getElementById('clear-member-filters-btn');
  clearBtn.classList.toggle('hidden', !anyActive);
  document.getElementById('clear-member-filters-count').textContent = activeCount;
  const clearLabel = activeCount > 0 ? `Clear ${activeCount} filter${activeCount > 1 ? 's' : ''}` : 'Clear filters';
  clearBtn.setAttribute('title', clearLabel);
  clearBtn.setAttribute('aria-label', clearLabel);

  updateMemberStatCardUI();
}

function clearMemberSearch() {
  const search = document.getElementById('member-search');
  search.value = '';
  updateMemberFilterUI();
  // Dispatching a native "search" event (rather than just clearing the value)
  // is what actually satisfies this input's hx-trigger and fires the refetch.
  search.dispatchEvent(new Event('search'));
}

function clearAllMemberFilters() {
  currentStandingFilter = null;
  document.getElementById('member-search').value = '';
  document.getElementById('department-filter').value = '';
  document.getElementById('restricted-filter').value = '';
  updateMemberFilterUI();
  htmx.ajax('GET', '/api/v1/members?' + new URLSearchParams({
    limit: '{{ limit }}',
    offset: 0,
    show_inactive: document.getElementById('show-inactive-toggle').checked ? '1' : '0',
    sort_by: '{{ sort_by }}',
    sort_dir: '{{ sort_dir }}'
  }).toString(), { target: '#member-table-container', swap: 'innerHTML' });
}

['member-search', 'department-filter', 'restricted-filter'].forEach(function (id) {
  const el = document.getElementById(id);
  el.addEventListener('input', function () { currentStandingFilter = null; updateMemberFilterUI(); });
  el.addEventListener('change', function () { currentStandingFilter = null; updateMemberFilterUI(); });
});
document.addEventListener('DOMContentLoaded', updateMemberFilterUI);

// Keeps the stat cards' ring/border highlight in sync with whichever standing
// they represent, mirroring Inventory's STAT_CARD_ACCENTS/updateStatCardUI.
// currentStandingFilter is tracked explicitly (rather than re-derived from
// is_restricted/show_inactive on every call) so highlighting reflects which
// card was actually clicked, and clears the moment someone edits a filter
// control directly instead of via a card.
// Defaults to '' (not null) so the "All Members" card -- data-standing=""
// -- is highlighted on initial page load, matching Inventory's default
// "All Inventory" card highlight (which falls out naturally there since its
// equivalent check reads the status-filter select's actual value, empty by
// default, instead of a separately-tracked JS variable).
let currentStandingFilter = '';

const STANDING_CARD_ACCENTS = {
  '': 'ring-primary/40 border-primary/40',
  'active': 'ring-success/40 border-success/40',
  'restricted': 'ring-warning/40 border-warning/40',
  'inactive': 'ring-base-content/30 border-base-content/30',
};

function updateMemberStatCardUI() {
  document.querySelectorAll('[data-standing]').forEach(function (card) {
    const isActive = currentStandingFilter === card.dataset.standing;
    card.classList.toggle('ring-2', isActive);
    card.classList.toggle('shadow-md', isActive);
    Object.values(STANDING_CARD_ACCENTS).forEach(function (cls) {
      cls.split(' ').forEach(function (c) { card.classList.remove(c); });
    });
    if (isActive) {
      STANDING_CARD_ACCENTS[card.dataset.standing].split(' ').forEach(function (cls) { card.classList.add(cls); });
    }
  });
}

// Same shortcut-filter behavior as Inventory's filterByStatus: clicking a
// card sends a fresh request for exactly that standing, independent of
// whatever's currently in the search box or department dropdown (those
// controls keep whatever value they're showing, but aren't included in this
// request) -- same trade-off Inventory already makes for its status cards.
// "All Members" clears the standing filter but leaves show_inactive off,
// same as Inventory's "All Inventory" card leaving the archived toggle alone.
//
// "Inactive" is an approximation: the current /api/v1/members endpoint has
// no way to return *only* inactive members, since show_inactive just adds
// them alongside everyone else. This sends is_active=0 in addition to
// show_inactive=1 so the backend can start honoring it precisely whenever
// that filter is added -- until then, it behaves the same as "All" but with
// show_inactive on.
function filterByStanding(standing) {
  currentStandingFilter = standing;

  const restrictedSelect = document.getElementById('restricted-filter');
  const inactiveToggle = document.getElementById('show-inactive-toggle');
  const inactiveToggleLabel = document.getElementById('inactive-toggle-label');
  const inactiveToggleText = document.getElementById('inactive-toggle-text');

  const params = {
    limit: '{{ limit }}',
    offset: 0,
    sort_by: '{{ sort_by }}',
    sort_dir: '{{ sort_dir }}'
  };

  if (standing === 'active') {
    restrictedSelect.value = '0';
    inactiveToggle.checked = false;
    params.is_restricted = '0';
    params.is_active = '1';
    params.show_inactive = '0';
  } else if (standing === 'restricted') {
    restrictedSelect.value = '1';
    inactiveToggle.checked = false;
    params.is_restricted = '1';
    params.is_active = '1';
    params.show_inactive = '0';
  } else if (standing === 'inactive') {
    restrictedSelect.value = '';
    inactiveToggle.checked = true;
    params.is_active = '0';
    params.show_inactive = '1';
  } else {
    restrictedSelect.value = '';
    inactiveToggle.checked = false;
    params.show_inactive = '0';
  }

  // Setting .checked directly (rather than dispatching a real "change" event)
  // skips the dedicated show-inactive-toggle listener, so update its pill
  // styling here instead -- avoids that listener resetting
  // currentStandingFilter right after this function just set it.
  const isInactiveView = inactiveToggle.checked;
  inactiveToggle.classList.toggle('toggle-warning', isInactiveView);
  inactiveToggleLabel.classList.toggle('text-warning', isInactiveView);
  inactiveToggleLabel.classList.toggle('font-semibold', isInactiveView);
  inactiveToggleLabel.classList.toggle('bg-warning/10', isInactiveView);
  inactiveToggleLabel.classList.toggle('text-base-content/70', !isInactiveView);
  inactiveToggleText.textContent = isInactiveView ? 'Viewing inactive' : 'Show inactive';

  updateMemberFilterUI();
  htmx.ajax('GET', '/api/v1/members?' + new URLSearchParams(params).toString(), {
    target: '#member-table-container',
    swap: 'innerHTML'
  });
}

// Keeps the address bar in sync with the current search/filter/sort/paging
// state, same as Inventory's equivalent listener -- scoped to requests
// actually targeting the member table (not modal-opening requests, which
// target #modal-container).
document.body.addEventListener('htmx:configRequest', function (evt) {
  const tableContainer = document.getElementById('member-table-container');
  if (evt.detail.target !== tableContainer) return;
  try {
    const params = evt.detail.parameters || {};
    const url = new URL(window.location.href);
    ['q', 'department_id', 'is_restricted', 'show_inactive', 'limit', 'offset', 'sort_by', 'sort_dir'].forEach(function (key) {
      url.searchParams.delete(key);
    });
    Object.keys(params).forEach(function (key) {
      const value = params[key];
      if (value !== '' && value !== null && value !== undefined) {
        url.searchParams.set(key, value);
      }
    });
    history.replaceState(null, '', url.pathname + '?' + url.searchParams.toString());
  } catch (e) {
    // URL sync is a non-critical enhancement -- never let it break the actual request.
  }
});
</script>

<script>
// Mirrors the same cold-load spacing workaround used on the Inventory page:
// replay the initial swap through htmx's own request path once, so the
// filter row settles into the same spacing it has after any later swap.
document.addEventListener('DOMContentLoaded', function () {
  var params = new URLSearchParams({
    limit: '{{ limit }}',
    offset: '{{ offset }}',
    show_inactive: '{{ "1" if show_inactive else "0" }}',
    sort_by: '{{ sort_by }}',
    sort_dir: '{{ sort_dir }}'
  });
  {% if request.args.get('q') %}
  params.set('q', {{ request.args.get('q') | tojson }});
  {% endif %}
  {% if request.args.get('department_id') %}
  params.set('department_id', {{ request.args.get('department_id') | tojson }});
  {% endif %}
  {% if request.args.get('is_restricted') is not none %}
  params.set('is_restricted', {{ request.args.get('is_restricted') | tojson }});
  {% endif %}
  htmx.ajax('GET', '/api/v1/members?' + params.toString(), {
    target: '#member-table-container',
    swap: 'innerHTML'
  });
});
</script>
{% endblock %}
