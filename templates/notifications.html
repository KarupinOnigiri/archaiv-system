{% extends "base.html" %}
{% block content %}
<div class="pt-6 pr-[1.875rem] pb-6 pl-6 space-y-6">

  <!-- Page header -->
  <div class="flex flex-wrap items-start justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold">Notifications</h1>
      
    </div>
    <div class="flex items-center gap-2">
      <button type="button" id="clear-selected-notifs-btn" class="btn btn-outline btn-error btn-sm hidden" onclick="clearSelectedNotifications()">
        Clear selected (<span id="clear-selected-notifs-count">0</span>)
      </button>
      <button type="button" id="mark-all-read-btn" class="btn btn-outline btn-sm" data-tooltip="Mark all as read (Alt+A)" onclick="markAllNotificationsRead()">
        Mark all as read
      </button>
    </div>
  </div>

  <!-- Toolbar + list -->
  <div class="bg-base-100 rounded-xl border border-panel p-5">

    <div class="relative mb-5">
      <div id="filter-row" class="flex flex-wrap items-center gap-3">

        <button type="button" id="refresh-notifications-btn" class="btn btn-ghost btn-sm btn-circle shrink-0" data-tooltip="Refresh list" aria-label="Refresh notifications list" onclick="refreshNotificationsTable()">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>

        <!-- No horizontal padding - keeps this checkbox aligned with each
             row's own .notif-row-checkbox, or "select all" visually points
             at nothing. -->
        <label class="flex items-center gap-2 text-sm cursor-pointer select-none" data-tooltip="Select all on this page">
          <input type="checkbox" id="select-all-notifs-checkbox" class="checkbox checkbox-sm shrink-0" aria-label="Select all notifications on this page">
          <span class="text-base-content/60">Select all</span>
        </label>

        {% set show_unread_only_qs = request.args.get('show_unread_only') == '1' %}
        <label id="unread-toggle-label" class="flex items-center gap-2 text-sm cursor-pointer select-none px-2.5 py-1 rounded-full transition-colors {% if show_unread_only_qs %}text-primary font-semibold bg-primary/10{% else %}text-base-content/70{% endif %}">
          <input type="checkbox" id="show-unread-only-toggle" name="show_unread_only"
                 class="toggle toggle-sm {% if show_unread_only_qs %}toggle-primary{% endif %}"
                 {% if show_unread_only_qs %}checked{% endif %}
                 hx-get="/api/v1/notifications/table"
                 hx-trigger="change"
                 hx-target="#notifications-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#table-spinner"
                 hx-include="#notif-since-filter, #notif-until-filter"
                 hx-vals='js:{"limit": {{ limit }}, "offset": 0, "show_unread_only": event.target.checked ? "1" : "0"}'>
          <span>Unread only</span>
        </label>

        <!-- Same plain-bordered join-item convention as transactions.html/
             monitoring.html/audit_log.html's own Today/Yesterday presets -
             not daisyUI's .btn chrome, which stood out next to the
             date-range boxes here. -->
        <div id="notif-date-presets" class="join rounded-lg" data-tooltip="Quick date filter">
          <button type="button" id="notif-preset-today" class="date-quick-btn join-item flex items-center px-3 h-8 border border-base-300 bg-base-100 text-sm text-base-content/70 hover:bg-base-200 hover:text-base-content transition-colors"
                  onclick="setNotifDatePreset('today')">Today</button>
          <button type="button" id="notif-preset-yesterday" class="date-quick-btn join-item flex items-center px-3 h-8 border border-base-300 bg-base-100 text-sm text-base-content/70 hover:bg-base-200 hover:text-base-content transition-colors"
                  onclick="setNotifDatePreset('yesterday')">Yesterday</button>
        </div>

        <div id="notif-date-filters" class="join rounded-lg transition-shadow" data-tooltip="Date range">
          <button type="button" id="notif-date-filter-clear-btn" class="join-item flex items-center px-2.5 h-8 border border-base-300 bg-base-100 text-base-content/40 hover:text-base-content hover:bg-base-200 disabled:hover:bg-base-100 disabled:hover:text-base-content/40 disabled:cursor-default disabled:opacity-50 transition-colors"
                  onclick="clearNotifDateFilter()" aria-label="Clear date range filter" data-tooltip="Clear date range filter" disabled>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
          </button>
          <input type="date" id="notif-since-filter" name="since"
                 aria-label="From date"
                 class="input input-bordered input-sm join-item w-32"
                 value="{{ request.args.get('since', '') }}"
                 data-tooltip="From"
                 hx-get="/api/v1/notifications/table"
                 hx-trigger="change"
                 hx-target="#notifications-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#table-spinner"
                 hx-include="#show-unread-only-toggle, #notif-until-filter"
                 hx-vals='{"limit": {{ limit }}, "offset": 0}'>
          <div class="join-item flex items-center px-1.5 h-8 border-t border-b border-base-300 bg-base-100 text-base-content/40 text-sm" aria-hidden="true">&ndash;</div>
          <input type="date" id="notif-until-filter" name="until"
                 aria-label="To date"
                 class="input input-bordered input-sm join-item w-32"
                 value="{{ request.args.get('until', '') }}"
                 data-tooltip="To"
                 hx-get="/api/v1/notifications/table"
                 hx-trigger="change"
                 hx-target="#notifications-table-container"
                 hx-swap="innerHTML"
                 hx-indicator="#table-spinner"
                 hx-include="#show-unread-only-toggle, #notif-since-filter"
                 hx-vals='{"limit": {{ limit }}, "offset": 0}'>
        </div>

        <button type="button" id="notif-clear-filters-btn" class="btn btn-ghost btn-xs btn-circle text-error hover:bg-error/10 hidden relative"
                onclick="clearAllNotifFilters()" data-tooltip="Clear filters (Esc)" aria-label="Clear filters">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
          <span id="notif-clear-filters-count" class="absolute -top-1 -right-1 bg-error text-error-content text-[10px] font-semibold rounded-full w-4 h-4 flex items-center justify-center leading-none">0</span>
        </button>

        <span id="table-spinner" class="htmx-indicator loading loading-spinner loading-sm text-primary"></span>
      </div>
    </div>

    <div id="notifications-table-container"
         hx-get="/api/v1/notifications/table"
         hx-trigger="load"
         hx-target="#notifications-table-container"
         hx-swap="innerHTML"
         hx-include="#show-unread-only-toggle, #notif-since-filter, #notif-until-filter"
         hx-vals='{"limit": {{ limit }}, "offset": {{ offset }} }'>
    </div>
  </div>
</div>

<style>
.htmx-indicator { opacity: 0; }
.htmx-request .htmx-indicator, .htmx-request.htmx-indicator { opacity: 1; }
</style>

<script>
function markOneNotificationRead(id, btn) {
  fetch(`/api/v1/notifications/${id}/mark-read`, {
    method: 'POST',
    headers: {
      'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
    },
  }).then((res) => {
    if (res.ok) {
      window.location.reload();
    } else if (res.status === 401) {
      showSessionTimeoutModal();
    } else {
      showToast("Couldn't mark notification as read", 'error');
    }
  }).catch(() => showToast("Couldn't mark notification as read", 'error'));
}

function clearOneNotification(id) {
  fetch(`/api/v1/notifications/${id}/clear`, {
    method: 'POST',
    headers: {
      'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
    },
  }).then((res) => {
    if (res.ok) {
      sessionStorage.setItem('pending-toast', JSON.stringify({ message: 'Notification cleared', type: 'success' }));
      window.location.reload();
    } else if (res.status === 401) {
      showSessionTimeoutModal();
    } else {
      showToast("Couldn't clear notification", 'error');
    }
  }).catch(() => showToast("Couldn't clear notification", 'error'));
}

function getSelectedNotificationIds() {
  return Array.from(document.querySelectorAll('.notif-row-checkbox:checked')).map((cb) => parseInt(cb.value, 10));
}

function updateClearSelectedBar() {
  const ids = getSelectedNotificationIds();
  const btn = document.getElementById('clear-selected-notifs-btn');
  document.getElementById('clear-selected-notifs-count').textContent = ids.length;
  btn.classList.toggle('hidden', ids.length === 0);

  // Tri-state "Select all" (indeterminate when only some rows are checked),
  // same pattern as the bulk-select tables (Staff/Members/etc).
  const all = document.querySelectorAll('.notif-row-checkbox');
  const selectAll = document.getElementById('select-all-notifs-checkbox');
  if (selectAll) {
    selectAll.checked = all.length > 0 && ids.length === all.length;
    selectAll.indeterminate = ids.length > 0 && ids.length < all.length;
  }
}

async function clearSelectedNotifications() {
  const ids = getSelectedNotificationIds();
  if (ids.length === 0) return;
  if (!confirm(`Clear ${ids.length} notification${ids.length === 1 ? '' : 's'}? This can't be undone from here.`)) return;

  try {
    const res = await fetch('/api/v1/notifications/clear', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
      },
      body: JSON.stringify({ ids }),
    });
    const data = await res.json();

    if (res.status === 401) {
      showSessionTimeoutModal();
      return;
    }
    if (!res.ok) {
      showToast(data.error || "Couldn't clear the selected notifications", 'error');
      return;
    }

    sessionStorage.setItem('pending-toast', JSON.stringify({ message: data.message, type: 'success' }));
    window.location.reload();
  } catch (err) {
    showToast("Couldn't clear the selected notifications", 'error');
  }
}

// Delegated, not attached per-row - the container's contents get swapped
// wholesale on every filter/page change, so a direct listener would need
// re-wiring after each swap.
document.getElementById('notifications-table-container').addEventListener('change', function (e) {
  if (e.target.classList.contains('notif-row-checkbox')) {
    updateClearSelectedBar();
  }
});
// Merged into one window.pageAfterSwapHandler with the second afterSwap
// listener further down this file (the single-slot dispatcher in ui.js
// only forwards to one handler per page - see its "BOOSTED NAVIGATION"
// comment) rather than two separate registrations.
window.pageAfterSwapHandler = function (evt) {
  if (evt.target && evt.target.id === 'notifications-table-container') {
    updateClearSelectedBar();
    updateNotifFilterUI();
  }
};

document.getElementById('select-all-notifs-checkbox').addEventListener('change', function (e) {
  const checked = e.target.checked;
  document.querySelectorAll('.notif-row-checkbox').forEach((cb) => { cb.checked = checked; });
  updateClearSelectedBar();
});

function formatDateLocal(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Prefer htmx's own trigger API over a raw dispatchEvent - more reliable
// across htmx versions than relying on native event bubbling.
function fireHtmxChange(el) {
  if (window.htmx) {
    htmx.trigger(el, 'change');
  } else {
    el.dispatchEvent(new Event('change', { bubbles: true }));
  }
}

// Re-fetches the list with whatever filters/page are currently in effect --
// unlike changing a filter, a manual refresh shouldn't jump back to page 1.
function refreshNotificationsTable() {
  const list = document.querySelector('#notifications-table-container [data-total-count]');
  const since = document.getElementById('notif-since-filter').value;
  const until = document.getElementById('notif-until-filter').value;
  const unreadOnly = document.getElementById('show-unread-only-toggle').checked;
  const params = new URLSearchParams();
  if (since) params.set('since', since);
  if (until) params.set('until', until);
  params.set('show_unread_only', unreadOnly ? '1' : '0');
  params.set('limit', (list && list.dataset.limit) || '{{ limit }}');
  params.set('offset', (list && list.dataset.offset) || '{{ offset }}');
  htmx.ajax('GET', '/api/v1/notifications/table', {
    target: '#notifications-table-container',
    swap: 'innerHTML',
    values: Object.fromEntries(params)
  });
}

function setNotifDatePreset(which) {
  const since = document.getElementById('notif-since-filter');
  const until = document.getElementById('notif-until-filter');
  const target = new Date();
  if (which === 'yesterday') target.setDate(target.getDate() - 1);
  const dateStr = formatDateLocal(target);
  since.value = dateStr;
  until.value = dateStr;
  fireHtmxChange(since);
}

function clearNotifDateFilter() {
  const since = document.getElementById('notif-since-filter');
  const until = document.getElementById('notif-until-filter');
  if (since.value === '' && until.value === '') return;
  since.value = '';
  until.value = '';
  fireHtmxChange(since);
}

function clearAllNotifFilters() {
  const since = document.getElementById('notif-since-filter');
  const until = document.getElementById('notif-until-filter');
  const unread = document.getElementById('show-unread-only-toggle');
  const hasFilters = since.value !== '' || until.value !== '' || unread.checked;
  if (!hasFilters) return;
  since.value = '';
  until.value = '';
  unread.checked = false;
  fireHtmxChange(since);
}

function updateNotifFilterUI() {
  const since = document.getElementById('notif-since-filter');
  const until = document.getElementById('notif-until-filter');
  const dateActive = since.value !== '' || until.value !== '';
  document.getElementById('notif-date-filters').classList.toggle('ring-2', dateActive);
  document.getElementById('notif-date-filters').classList.toggle('ring-primary/40', dateActive);
  document.getElementById('notif-date-filter-clear-btn').disabled = !dateActive;

  const today = formatDateLocal(new Date());
  const yesterday = formatDateLocal(new Date(Date.now() - 86400000));
  const isToday = since.value === today && until.value === today;
  const isYesterday = since.value === yesterday && until.value === yesterday;
  // Plain-bordered active/inactive swap, matching transactions.html's own
  // date-quick-btn convention now that this page uses the same markup.
  const notifTodayBtn = document.getElementById('notif-preset-today');
  const notifYesterdayBtn = document.getElementById('notif-preset-yesterday');
  notifTodayBtn.classList.toggle('border-primary', isToday);
  notifTodayBtn.classList.toggle('bg-primary/10', isToday);
  notifTodayBtn.classList.toggle('text-primary', isToday);
  notifYesterdayBtn.classList.toggle('border-primary', isYesterday);
  notifYesterdayBtn.classList.toggle('bg-primary/10', isYesterday);
  notifYesterdayBtn.classList.toggle('text-primary', isYesterday);

  const unreadToggle = document.getElementById('show-unread-only-toggle');
  const unreadLabel = document.getElementById('unread-toggle-label');
  unreadLabel.classList.toggle('text-primary', unreadToggle.checked);
  unreadLabel.classList.toggle('font-semibold', unreadToggle.checked);
  unreadLabel.classList.toggle('bg-primary/10', unreadToggle.checked);
  unreadLabel.classList.toggle('text-base-content/70', !unreadToggle.checked);
  unreadToggle.classList.toggle('toggle-primary', unreadToggle.checked);

  const activeCount = (dateActive ? 1 : 0) + (unreadToggle.checked ? 1 : 0);
  const clearBtn = document.getElementById('notif-clear-filters-btn');
  clearBtn.classList.toggle('hidden', activeCount === 0);
  document.getElementById('notif-clear-filters-count').textContent = activeCount;
  const clearLabel = activeCount > 0 ? `Clear ${activeCount} filter${activeCount > 1 ? 's' : ''}` : 'Clear filters';
  clearBtn.setAttribute('title', clearLabel);
  clearBtn.setAttribute('aria-label', clearLabel);
}

document.getElementById('show-unread-only-toggle').addEventListener('change', updateNotifFilterUI);

window.pageConfigRequestHandler = function (evt) {
  const container = document.getElementById('notifications-table-container');
  if (evt.detail.target !== container) return;
  try {
    const params = evt.detail.parameters || {};
    const url = new URL(window.location.href);
    ['show_unread_only', 'since', 'until', 'limit', 'offset'].forEach(function (key) {
      if (params[key] !== undefined && params[key] !== '' && params[key] !== '0') {
        url.searchParams.set(key, params[key]);
      } else {
        url.searchParams.delete(key);
      }
    });
    window.history.replaceState({}, '', url);
  } catch (e) {}
};

// --- Keyboard shortcuts (Notifications page) ---
// Same isTypingTarget/isModalOpen guard as every other tab.
function isTypingTarget(el) {
  if (!el) return false;
  const tag = el.tagName;
  return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
}

function isModalOpen() {
  const container = document.getElementById('modal-container');
  return !!(container && container.querySelector(':scope > .modal'));
}

window.pageKeydownHandler = function (e) {
  if (e.ctrlKey || e.metaKey) return;

  // ArrowLeft / ArrowRight - previous / next page.
  if (!e.altKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    if (isTypingTarget(e.target) || isModalOpen()) return;
    const container = document.getElementById('notifications-table-container');
    if (!container) return;
    const label = e.key === 'ArrowRight' ? 'Next page' : 'Previous page';
    const btn = container.querySelector('button[aria-label="' + label + '"]');
    if (btn && !btn.disabled) {
      e.preventDefault();
      btn.click();
    }
    return;
  }

  // Alt+A - "Mark all as read", same Alt+letter convention as other tabs.
  if (e.altKey && (e.key === 'a' || e.key === 'A')) {
    if (isModalOpen()) return;
    e.preventDefault();
    document.getElementById('mark-all-read-btn').click();
    return;
  }

  // Escape - with no modal open, reset every filter, same as clicking
  // "Clear filters".
  if (e.key === 'Escape') {
    if (isModalOpen()) return;
    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }
    clearAllNotifFilters();
  }
};

setTimeout(updateNotifFilterUI, 0);
</script>
{% endblock %}
