<div class="modal modal-open">
  <div class="modal-box max-w-sm border-2 border-error">
    <div class="flex justify-between items-start mb-2">
      <h3 class="font-bold text-lg text-error">Dismiss alarm (software override)</h3>
      <button type="button" class="btn btn-ghost btn-xs h-6 min-h-0 px-2 font-mono text-[10px] font-bold tracking-wider border border-base-300 rounded-md hover:bg-base-200 hover:border-base-content/40 active:scale-95 transition-all shrink-0"
              onclick="this.closest('.modal').remove()" aria-label="Close (Esc)" data-tooltip="Close (Esc)">ESC</button>
    </div>
    <p class="text-sm text-base-content/70 mb-4">
      This is a fallback for when the tool room's physical Master Key Card reader isn't available - the normal way
      to clear this alarm is still tapping the Admin's card there. This gets logged separately from a real card tap.
    </p>

    <div id="alarm-override-error" class="alert alert-error text-sm mb-3 py-2 hidden"></div>

    <div class="form-control mb-2">
      <label class="label"><span class="label-text">Your password <span class="text-error">*</span></span></label>
      <input type="password" id="alarm-override-password" placeholder="Current password"
             autocomplete="current-password" class="input input-bordered input-sm w-full"
             onkeydown="if (event.key === 'Enter') submitAlarmOverrideForm();">
    </div>

    <div class="modal-action">
      <button type="button" class="btn" onclick="this.closest('.modal').remove()">Cancel</button>
      <button type="button" class="btn btn-error" onclick="submitAlarmOverrideForm()">Dismiss alarm</button>
    </div>
  </div>
</div>

<script>
// Same check_password_hash re-confirmation pattern as
// staff/_backup_delete_modal.html - see routes/monitoring.py's
// override_dismiss_alarm() for why this exists as a deliberately
// heavier, distinctly-logged fallback rather than a plain dismiss button.
async function submitAlarmOverrideForm() {
  const errorBox = document.getElementById('alarm-override-error');
  errorBox.classList.add('hidden');

  const password = document.getElementById('alarm-override-password').value;
  if (!password) {
    errorBox.textContent = 'Enter your password to confirm this';
    errorBox.classList.remove('hidden');
    return;
  }

  try {
    const res = await fetch('/api/v1/monitoring/alarm/override-dismiss', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRF-Token': document.querySelector('meta[name="csrf-token"]').content,
      },
      body: JSON.stringify({ password: password }),
    });

    if (!res.ok) {
      let message = "That alarm couldn't be dismissed";
      try {
        const result = await res.json();
        message = result.error || message;
      } catch (e) {}
      errorBox.textContent = message;
      errorBox.classList.remove('hidden');
      return;
    }

    document.getElementById('alarm-override-password').closest('.modal').remove();
    // Nudges the banner/stat cards/table to catch up immediately instead
    // of waiting for their own next poll tick.
    if (typeof refreshMonitoringTable === 'function') refreshMonitoringTable();
    htmx.ajax('GET', '/api/v1/monitoring/alarm-banner', { target: '#alarm-banner', swap: 'innerHTML' });
  } catch (err) {
    errorBox.textContent = "That alarm couldn't be dismissed";
    errorBox.classList.remove('hidden');
  }
}
</script>
