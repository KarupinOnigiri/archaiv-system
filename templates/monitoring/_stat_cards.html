<!-- Today-scoped counts, same clickable-glow-card style as assets/_stat_cards.html.
     Clicking one sets the classification filter select and re-fires the table --
     mirrors filterByStatus() on the Inventory page. -->
<div id="stat-card-monitor-total" data-classification="" class="bg-base-100 rounded-xl border border-base-300 p-5 flex items-start justify-between cursor-pointer transition-all hover:shadow-md hover:border-primary/30 stat-card-glow"
     style="--stat-glow: var(--color-primary)"
     role="button" tabindex="0" aria-label="Show all today's events" data-tooltip="Show all today's events"
     onclick="filterByClassification('')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();filterByClassification('');}">
  <div>
    <p class="text-xs font-semibold text-base-content/50 tracking-wide">EVENTS TODAY</p>
    <p class="text-2xl font-bold mt-1">{{ stat_total }}</p>
  </div>
  <div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2a10 10 0 100 20 10 10 0 000-20z"/><path d="M12 6v6l4 2"/></svg>
  </div>
</div>

<div id="stat-card-monitor-authorized" data-classification="authorized" class="bg-base-100 rounded-xl border border-base-300 p-5 flex items-start justify-between cursor-pointer transition-all hover:shadow-md hover:border-success/30 stat-card-glow"
     style="--stat-glow: var(--color-success)"
     role="button" tabindex="0" aria-label="Filter by authorized" data-tooltip="Filter by authorized"
     onclick="filterByClassification('authorized')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();filterByClassification('authorized');}">
  <div>
    <p class="text-xs font-semibold text-base-content/50 tracking-wide">AUTHORIZED</p>
    <p class="text-2xl font-bold mt-1">{{ stat_authorized }}</p>
  </div>
  <div class="w-10 h-10 rounded-full bg-success/10 flex items-center justify-center shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
  </div>
</div>

<div id="stat-card-monitor-unauthorized" data-classification="unauthorized" class="bg-base-100 rounded-xl border border-base-300 p-5 flex items-start justify-between cursor-pointer transition-all hover:shadow-md hover:border-error/30 stat-card-glow"
     style="--stat-glow: var(--color-error)"
     role="button" tabindex="0" aria-label="Filter by unauthorized" data-tooltip="Filter by unauthorized"
     onclick="filterByClassification('unauthorized')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();filterByClassification('unauthorized');}">
  <div>
    <p class="text-xs font-semibold text-base-content/50 tracking-wide">UNAUTHORIZED</p>
    <p class="text-2xl font-bold mt-1">{{ stat_unauthorized }}</p>
  </div>
  <div class="w-10 h-10 rounded-full bg-error/10 flex items-center justify-center shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
  </div>
</div>

<div id="stat-card-monitor-unknown" data-classification="unknown_tag" class="bg-base-100 rounded-xl border border-base-300 p-5 flex items-start justify-between cursor-pointer transition-all hover:shadow-md hover:border-warning/30 stat-card-glow"
     style="--stat-glow: var(--color-warning)"
     role="button" tabindex="0" aria-label="Filter by unknown tag" data-tooltip="Filter by unknown tag"
     onclick="filterByClassification('unknown_tag')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();filterByClassification('unknown_tag');}">
  <div>
    <p class="text-xs font-semibold text-base-content/50 tracking-wide">UNKNOWN TAG</p>

  </div>
  <div class="w-10 h-10 rounded-full bg-warning/10 flex items-center justify-center shrink-0">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
  </div>
