{% extends "base.html" %}
{% block content %}

<!-- Load Archivo Font from Google Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&display=swap" rel="stylesheet">

<div class="fixed inset-0 bg-gradient-to-br from-base-200 via-base-200 to-secondary/10 overflow-hidden">

  <div id="login-bg-layer" class="absolute inset-0 bg-cover bg-center opacity-0 transition-opacity duration-1000 pointer-events-none"></div>

  <div class="relative min-h-full flex items-center justify-center p-4">

  <div class="w-full max-w-sm bg-base-100 rounded-xl shadow-xl shadow-primary/10 p-8">

    <!-- Logo + "Archaív" Label -->
    <div class="flex flex-col items-center mb-6 gap-1">
      <!-- Same .logo-theme-light/.logo-theme-dark swap base.html's sidebar
           logo uses -- the login card is always bg-base-100, which is
           light for "tesda" (Mixed and Light modes look identical here,
           this page has no sidebar to differ on) and dark for
           "tesda-dark", so it needs the same theme-appropriate logo. -->
      <img src="{{ url_for('static', filename='images/logo-icon-light.png') }}" alt="Archaív" class="logo-theme-light h-26 w-auto">
      <img src="{{ url_for('static', filename='images/logo-icon-dark.png') }}" alt="Archaív" class="logo-theme-dark h-26 w-auto">
      <span class="text-4xl font-bold tracking-tight text-base-content" style="font-family: 'Archivo', sans-serif;">
        Archaív
      </span>
    </div>

    <h1 class="text-2xl font-semibold text-center mb-1.5 text-base-content">Welcome back!</h1>
    <p class="text-sm text-base-content/50 text-center mb-9">Sign in to your account</p>

    <form method="POST" action="{{ url_for('auth.login') }}" id="login-form" novalidate class="space-y-4">

      <div class="form-control">
        <label class="input rounded-[10px] w-full bg-base-200 border-none flex items-center gap-2 px-4 transition-shadow focus-within:ring-2 focus-within:ring-secondary/60 {% if error %}outline outline-2 outline-error{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-base-content/50 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21a8 8 0 10-16 0"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input
            type="text"
            name="username"
            id="username-field"
            value="{{ username or '' }}"
            autocomplete="username"
            autofocus
            placeholder="Username or Barcode ID"
            class="grow bg-transparent border-none outline-none focus:outline-none"
          >
        </label>
        <p id="username-empty-msg" class="hidden text-error text-xs mt-1.5 ml-4 items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 002 0V6zm-1 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd"/>
          </svg>
          Please enter your username or barcode ID.
        </p>
      </div>

      <div class="form-control">
        <label class="input rounded-[10px] w-full bg-base-200 border-none flex items-center gap-2 px-4 transition-shadow focus-within:ring-2 focus-within:ring-secondary/60 {% if error %}outline outline-2 outline-error{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-base-content/50 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
          <input
            type="password"
            name="password"
            id="password-field"
            autocomplete="current-password"
            placeholder="Password"
            class="grow bg-transparent border-none outline-none focus:outline-none"
          >
          <button
            type="button"
            id="toggle-password-btn"
            onclick="togglePassword()"
            aria-label="Show password"
            class="text-base-content/40 hover:text-base-content hidden shrink-0"
          >
            <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
              <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.774 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
            </svg>
          </button>
        </label>
        <p id="password-empty-msg" class="hidden text-error text-xs mt-1.5 ml-4 items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 002 0V6zm-1 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd"/>
          </svg>
          Please enter your password.
        </p>
        {% if error %}
        <p class="flex items-start gap-1.5 text-error text-xs mt-1.5 ml-4">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 mt-0.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 002 0V6zm-1 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd"/>
          </svg>
          <span>{{ error }}</span>
        </p>
        {% endif %}
      </div>

      <p class="text-right text-sm text-base-content/50 -mt-1">
        Forgot your password? <span class="text-secondary font-medium">Contact your administrator</span>
      </p>

      <button type="submit" class="btn btn-primary w-full rounded-[18px] mt-5 py-3 h-auto text-base shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30 hover:brightness-110 active:scale-[0.98] transition-all">
        Sign in
      </button>
    </form>

    <!-- RFID + PIN login -- admin-only (routes/auth.py:login_rfid
         enforces this server-side too), hidden behind a toggle rather
         than shown alongside the password form by default: it's a
         secondary path for staff who actually have a card issued, not
         the primary way most staff sign in. -->
    <button type="button" id="show-rfid-login-btn" onclick="toggleRfidLogin(true)"
            class="w-full text-center text-sm text-base-content/50 hover:text-base-content mt-4 flex items-center justify-center gap-1.5">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
      Admin? Sign in with RFID card
    </button>

    <form id="rfid-login-form" novalidate class="space-y-4 hidden">
      <div class="form-control">
        <label class="input rounded-[10px] w-full bg-base-200 border-none flex items-center gap-2 px-4 transition-shadow focus-within:ring-2 focus-within:ring-secondary/60">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-base-content/50 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
          <input
            type="text"
            id="rfid-id-field"
            autocomplete="off"
            placeholder="Scan RFID card"
            class="grow bg-transparent border-none outline-none focus:outline-none"
          >
        </label>
      </div>

      <div class="form-control">
        <label class="input rounded-[10px] w-full bg-base-200 border-none flex items-center gap-2 px-4 transition-shadow focus-within:ring-2 focus-within:ring-secondary/60">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-base-content/50 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2"/>
            <path d="M8 10V7a4 4 0 018 0v3"/>
          </svg>
          <input
            type="password"
            id="rfid-pin-field"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="8"
            autocomplete="off"
            placeholder="PIN"
            class="grow bg-transparent border-none outline-none focus:outline-none"
          >
        </label>
      </div>

      <div id="rfid-login-error" class="hidden flex items-start gap-1.5 text-error text-xs -mt-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 mt-0.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 002 0V6zm-1 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd"/>
        </svg>
        <span id="rfid-login-error-text"></span>
      </div>

      <button type="submit" class="btn btn-primary w-full rounded-[18px] py-3 h-auto text-base shadow-md shadow-primary/20 hover:shadow-lg hover:shadow-primary/30 hover:brightness-110 active:scale-[0.98] transition-all">
        Sign in with RFID
      </button>
      <button type="button" onclick="toggleRfidLogin(false)" class="w-full text-center text-sm text-base-content/50 hover:text-base-content">
        Use username/password instead
      </button>
    </form>

  </div>

  </div>
</div>

<script>
if (window.location.search.includes('error=')) {
  history.replaceState(null, '', '/login');
}

(function() {
  const bgUrl = "{{ url_for('static', filename='images/Login-bg.png') }}";
  const testImg = new Image();
  testImg.onload = function() {
    const layer = document.getElementById('login-bg-layer');
    layer.style.backgroundImage = `url('${bgUrl}')`;
    layer.classList.remove('opacity-0');
    layer.classList.add('opacity-70');
  };
  testImg.onerror = function() {
    // Login-bg.png not found — leave background as is
  };
  testImg.src = bgUrl;
})();

function togglePassword() {
  const field = document.getElementById('password-field');
  const eyeOpen = document.getElementById('eye-open');
  const eyeClosed = document.getElementById('eye-closed');
  if (field.type === 'password') {
    field.type = 'text';
    eyeOpen.classList.remove('hidden');
    eyeClosed.classList.add('hidden');
  } else {
    field.type = 'password';
    eyeOpen.classList.add('hidden');
    eyeClosed.classList.remove('hidden');
  }
}

document.getElementById('password-field').addEventListener('input', function() {
  const toggleBtn = document.getElementById('toggle-password-btn');
  toggleBtn.classList.toggle('hidden', this.value.length === 0);
});

document.getElementById('login-form').addEventListener('submit', function(e) {
  const username = document.getElementById('username-field');
  const password = document.getElementById('password-field');
  const usernameMsg = document.getElementById('username-empty-msg');
  const passwordMsg = document.getElementById('password-empty-msg');
  let hasEmpty = false;

  if (!username.value.trim()) {
    username.classList.add('input-error');
    usernameMsg.classList.remove('hidden');
    usernameMsg.classList.add('flex');
    hasEmpty = true;
  } else {
    username.classList.remove('input-error');
    usernameMsg.classList.add('hidden');
  }

  if (!password.value.trim()) {
    password.classList.add('input-error');
    passwordMsg.classList.remove('hidden');
    passwordMsg.classList.add('flex');
    hasEmpty = true;
  } else {
    password.classList.remove('input-error');
    passwordMsg.classList.add('hidden');
  }

  if (hasEmpty) {
    e.preventDefault();
  }
});

// Toggles between the two login forms -- password (default) and RFID
// card + PIN (admin-only, see routes/auth.py:login_rfid). Only one is
// ever visible/interactive at a time; switching back to password mode
// also clears whatever was typed into the RFID fields, same reasoning
// as a password field never being resubmitted on reload.
function toggleRfidLogin(showRfid) {
  document.getElementById('login-form').classList.toggle('hidden', showRfid);
  document.getElementById('show-rfid-login-btn').classList.toggle('hidden', showRfid);
  document.getElementById('rfid-login-form').classList.toggle('hidden', !showRfid);
  document.getElementById('rfid-login-error').classList.add('hidden');
  if (showRfid) {
    document.getElementById('rfid-id-field').value = '';
    document.getElementById('rfid-pin-field').value = '';
    document.getElementById('rfid-id-field').focus();
  }
}

// /api/v1/login-rfid is JSON-only (same as every other JSON API
// route in this app) -- posts via fetch rather than a plain form
// submission, same pattern as staff/_add_modal.html's
// submitAddStaffForm. On success there's no HX-Redirect (this isn't an
// htmx request) so the redirect happens here explicitly; RFID login is
// admin-only, so unlike the password form there's no temp-admin
// setup-wizard case to special-case -- straight to the dashboard.
document.getElementById('rfid-login-form').addEventListener('submit', async function (e) {
  e.preventDefault();
  const rfidId = document.getElementById('rfid-id-field').value.trim();
  const pin = document.getElementById('rfid-pin-field').value.trim();
  const errorBox = document.getElementById('rfid-login-error');
  const errorText = document.getElementById('rfid-login-error-text');
  errorBox.classList.add('hidden');

  if (!rfidId || !pin) {
    errorText.textContent = 'Scan your card and enter your PIN.';
    errorBox.classList.remove('hidden');
    return;
  }

  try {
    const res = await fetch('/api/v1/login-rfid', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rfid_id: rfidId, pin: pin }),
    });
    const result = await res.json();

    if (!res.ok) {
      errorText.textContent = result.error || 'Sign-in failed';
      errorBox.classList.remove('hidden');
      document.getElementById('rfid-pin-field').value = '';
      return;
    }

    window.location.href = '/';
  } catch (err) {
    errorText.textContent = 'Sign-in failed';
    errorBox.classList.remove('hidden');
  }
});
</script>
{% endblock %}
