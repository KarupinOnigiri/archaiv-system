{% extends "base.html" %}
{% block content %}

<div id="bg-container" class="fixed inset-0 overflow-hidden" style="background-image: url('{{ url_for('static', filename='images/bglogin.jpg') }}'); background-size: cover; background-position: center;">

  <div class="absolute inset-0" style="background-color: #f1f4fb; opacity: 0.60;"></div>

  <div id="login-card"
       class="fixed w-full max-w-sm bg-base-100 border-primary rounded-lg shadow-2xl p-8 cursor-grab select-none">

    <div class="flex justify-center mb-5">
      <div class="w-14 h-14 rounded-2xl bg-primary flex items-center justify-center pointer-events-none">
        <span class="text-primary-content text-2xl font-bold">T</span>
      </div>
    </div>

    <h1 class="text-2xl font-bold text-center mb-8 pointer-events-none">Sign in</h1>

    <form method="POST" action="{{ url_for('auth.login') }}" id="login-form" novalidate style="display: flex; flex-direction: column; gap: 20px;">

      <div>
        <div class="fb-field">
          <input
            type="text"
            name="username"
            id="username-field"
            value="{{ username or '' }}"
            class="fb-input {% if error %}fb-input-error{% endif %}"
          >
          <label id="username-label" for="username-field" class="fb-label">Username</label>
        </div>
        <p id="username-empty-msg" class="hidden text-error text-xs mt-1 items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 002 0V6zm-1 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd"/>
          </svg>
          Please enter your username.
        </p>
      </div>

      <div>
        <div class="fb-field">
          <input
            type="password"
            name="password"
            id="password-field"
            class="fb-input pr-10 {% if error %}fb-input-error{% endif %}"
          >
          <label id="password-label" for="password-field" class="fb-label">Password</label>
          <button
            type="button"
            id="toggle-password-btn"
            onclick="togglePassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-base-content/50 hover:text-base-content scale-90 hidden"
          >
            <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/>
              <path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <svg id="eye-closed" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.98 8.223A10.477 10.477 0 001.934 12c1.292 4.338 5.31 7.5 10.066 7.5.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0112 4.5c4.756 0 8.774 3.162 10.065 7.498a10.522 10.522 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/>
            </svg>
          </button>
        </div>
        <p id="password-empty-msg" class="hidden text-error text-xs mt-1 items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 inline" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 002 0V6zm-1 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd"/>
          </svg>
          Please enter your password.
        </p>
        {% if error %}
        <p class="flex items-start gap-1.5 text-error text-xs mt-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 mt-0.5 shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10A8 8 0 11 2 10a8 8 0 0116 0zm-7-4a1 1 0 10-2 0v4a1 1 0 002 0V6zm-1 8a1.25 1.25 0 100-2.5 1.25 1.25 0 000 2.5z" clip-rule="evenodd"/>
          </svg>
          <span>{{ error }}</span>
        </p>
        {% endif %}
      </div>

      <button type="submit" class="btn btn-primary w-full rounded-full">
        Sign in
      </button>
    </form>

    <p class="text-center text-sm text-base-content/60 mt-7 pointer-events-none">
      Forgot your password? Contact your administrator.
    </p>

  </div>
</div>

<style>
.fb-field {
  position: relative;
}
.fb-input {
  width: 100%;
  height: 3.375rem;
  padding: 1.25rem 0.875rem 0.4rem 0.875rem;
  font-size: 0.95rem;
  border: 1px solid #ccd0d5;
  border-radius: 0.5rem;
  background: var(--color-base-100);
  color: var(--color-base-content);
  outline: none;
  transition: border-color 0.1s ease, box-shadow 0.1s ease;
}
.fb-input:hover {
  border-color: #b0b3b8;
}
.fb-input:focus {
  border-color: var(--color-primary);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--color-primary) 20%, transparent);
}
.fb-input-error {
  border-color: #e41e3f !important;
}
.fb-input-error:focus {
  box-shadow: 0 0 0 2px color-mix(in srgb, #e41e3f 20%, transparent);
}
.fb-label {
  position: absolute;
  left: 0.875rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.95rem;
  color: #65676b;
  pointer-events: none;
  transition: top 0.1s ease, font-size 0.1s ease, transform 0.1s ease;
}
.fb-label.floated {
  top: 0.55rem;
  transform: translateY(0);
  font-size: 0.68rem;
  color: #65676b;
}
.fb-input:focus + .fb-label {
  color: var(--color-primary);
}
</style>

<script>
if (window.location.search.includes('error=')) {
  history.replaceState(null, '', '/login');
}

function setupFloatingLabel(inputId, labelId) {
  const input = document.getElementById(inputId);
  const label = document.getElementById(labelId);
  function updateLabel() {
    if (document.activeElement === input || input.value.length > 0) {
      label.classList.add('floated');
    } else {
      label.classList.remove('floated');
    }
  }
  input.addEventListener('focus', updateLabel);
  input.addEventListener('blur', updateLabel);
  input.addEventListener('input', updateLabel);
  updateLabel();
}
setupFloatingLabel('username-field', 'username-label');
setupFloatingLabel('password-field', 'password-label');

function togglePassword() {
  const field = document.getElementById('password-field');
  const eyeOpen = document.getElementById('eye-open');
  const eyeClosed = document.getElementById('eye-closed');
  if (field.type === 'password') {
    field.type = 'text';
    eyeOpen.classList.remove('hidden');
    eyeClosed.classList.add('hidden');
  } else {
    field.type = 'password';
    eyeOpen.classList.add('hidden');
    eyeClosed.classList.remove('hidden');
  }
}

document.getElementById('password-field').addEventListener('input', function() {
  const toggleBtn = document.getElementById('toggle-password-btn');
  if (this.value.length > 0) {
    toggleBtn.classList.remove('hidden');
  } else {
    toggleBtn.classList.add('hidden');
  }
});

document.getElementById('login-form').addEventListener('submit', function(e) {
  const username = document.getElementById('username-field');
  const password = document.getElementById('password-field');
  const usernameMsg = document.getElementById('username-empty-msg');
  const passwordMsg = document.getElementById('password-empty-msg');
  let hasEmpty = false;

  if (!username.value.trim()) {
    username.classList.add('fb-input-error');
    usernameMsg.classList.remove('hidden');
    usernameMsg.classList.add('flex');
    hasEmpty = true;
  } else {
    username.classList.remove('fb-input-error');
    usernameMsg.classList.add('hidden');
  }

  if (!password.value.trim()) {
    password.classList.add('fb-input-error');
    passwordMsg.classList.remove('hidden');
    passwordMsg.classList.add('flex');
    hasEmpty = true;
  } else {
    password.classList.remove('fb-input-error');
    passwordMsg.classList.add('hidden');
  }

  if (hasEmpty) {
    e.preventDefault();
  }
});

(function() {
  const card = document.getElementById('login-card');
  let isDragging = false;
  let offsetX = 0;
  let offsetY = 0;
  const NON_DRAG_TAGS = ['INPUT', 'BUTTON', 'A', 'LABEL'];

  function isInteractive(target) {
    return NON_DRAG_TAGS.includes(target.tagName) || target.closest('button, input, a');
  }

  function centerCard() {
    const rect = card.getBoundingClientRect();
    card.style.left = (window.innerWidth / 2 - rect.width / 2) + 'px';
    card.style.top = (window.innerHeight / 2 - rect.height / 2) + 'px';
  }
  centerCard();
  window.addEventListener('resize', centerCard);

  function startDrag(clientX, clientY, target) {
    if (isInteractive(target)) return;
    const rect = card.getBoundingClientRect();
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
    isDragging = true;
    card.classList.remove('cursor-grab');
    card.classList.add('cursor-grabbing');
  }

  function moveDrag(clientX, clientY) {
    if (!isDragging) return;
    const rect = card.getBoundingClientRect();
    let newLeft = clientX - offsetX;
    let newTop = clientY - offsetY;
    newLeft = Math.max(0, Math.min(newLeft, window.innerWidth - rect.width));
    newTop = Math.max(0, Math.min(newTop, window.innerHeight - rect.height));
    card.style.left = newLeft + 'px';
    card.style.top = newTop + 'px';
  }

  function endDrag() {
    isDragging = false;
    card.classList.remove('cursor-grabbing');
    card.classList.add('cursor-grab');
  }

  card.addEventListener('mousedown', (e) => startDrag(e.clientX, e.clientY, e.target));
  window.addEventListener('mousemove', (e) => moveDrag(e.clientX, e.clientY));
  window.addEventListener('mouseup', endDrag);
  card.addEventListener('touchstart', (e) => { const t = e.touches[0]; startDrag(t.clientX, t.clientY, e.target); });
  window.addEventListener('touchmove', (e) => { const t = e.touches[0]; moveDrag(t.clientX, t.clientY); });
  window.addEventListener('touchend', endDrag);
})();
</script>
{% endblock %}
